name: Deploy MINIYENA
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: miniyena-pages-deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
      - name: Verify standalone Cloudflare administrator page
        run: |
          python3 cloudflare_pages_build.py
          test -s cloudflare-dist/admin/index.html
          test -s cloudflare-dist/admin/manifest.webmanifest
          grep -q 'admin/manifest.webmanifest' cloudflare-dist/admin/index.html
          grep -q 'dedicatedAdminPage' cloudflare-dist/admin/index.html
      # The downloaded GitHub Actions artifact is itself a ZIP of this directory,
      # ready for Cloudflare Pages Direct Upload without nested ZIP extraction.
      - name: Save Cloudflare direct-upload package
        uses: actions/upload-artifact@v4
        with:
          name: miniyena-cloudflare-upload
          path: cloudflare-dist/
          retention-days: 7
      # Deploy to the existing miniyena.pages.dev Direct Upload project.
      # Enabled automatically once both repository secrets have been configured.
      - name: Check Cloudflare deployment credentials
        id: cloudflare_credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -n "$CLOUDFLARE_ACCOUNT_ID" && -n "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare auto-deploy is waiting for two repository secrets."
          fi
      - name: Publish Cloudflare Pages production
        if: steps.cloudflare_credentials.outputs.ready == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          # Use the *existing project's* production branch so this deploy
          # never accidentally creates only a preview URL.
          response="$(curl --fail-with-body --silent --show-error --retry 2 \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/miniyena" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"
          branch="$(printf '%s' "$response" | python3 -c 'import json,sys; x=json.load(sys.stdin); b=(x.get("result") or {}).get("production_branch"); assert x.get("success") and isinstance(b,str) and b, "Production branch not found"; print(b)')"
          npx --yes wrangler@4 pages deploy cloudflare-dist --project-name=miniyena --branch="$branch" --commit-hash="$GITHUB_SHA"
      - name: Build public storefront without the Cloudflare admin page
        run: |
          python3 cloudflare_pages_build.py --github
          test ! -d cloudflare-dist/admin
      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: cloudflare-dist
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4

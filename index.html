mber{font-size:14px;font-weight:800;white-space:nowrap}.muted{color:var(--muted)}.empty{text-align:center;padding:36px 15px;color:var(--muted);font-size:13px;line-height:1.9}.empty .emoji{font-size:30px}.tagrow{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.orderlist .buyerblock{border:1px solid var(--border);background:white;border-radius:17px;margin:10px 0;overflow:hidden}.buyerhead{display:flex;align-items:center;gap:10px;padding:15px;text-align:left;width:100%;border:0;background:white;color:var(--ink)}.buyerhead .chevron{color:var(--muted);font-size:18px}.buyerbody{border-top:1px solid var(--border);padding:4px 14px 14px}.textbtn{border:0;background:none;color:var(--primary);font-size:12px;font-weight:800;padding:6px 0}.meter{height:8px;background:#e9e7f8;border-radius:9px;overflow:hidden;margin:15px 0 4px}.meter>div{height:100%;background:var(--primary);border-radius:9px}.search{width:100%;padding:13px 14px;border:1px solid var(--border);border-radius:13px;outline:none;background:white;color:var(--ink);font-size:14px}.search:focus,input:focus,select:focus,textarea:focus{outline:2px solid #bcb5fa;outline-offset:0}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:660px;background:#ffffffed;backdrop-filter:blur(18px);border-top:1px solid #ececf3;display:grid;grid-template-columns:repeat(5,1fr);padding:9px 7px calc(9px + env(safe-area-inset-bottom));z-index:10;box-shadow:0 -4px 20px #2520520b}.nav{display:flex;flex-direction:column;align-items:center;gap:5px;border:0;background:none;padding:5px 0;color:#85859a;font-size:10px;font-weight:700}.nav .symbol{font-size:21px;line-height:1.2}.nav.active{color:var(--primary)}.nav.active .symbol{filter:saturate(1.3)}.modalouter{position:fixed;inset:0;background:rgba(28,25,59,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}.modal{background:white;width:100%;max-width:660px;max-height:93dvh;overflow:auto;border-radius:23px 23px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));overscroll-behavior:contain}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modalhead h2{font-size:19px;letter-spacing:-.6px;margin:0}.close{border:0;background:#f0f0f5;border-radius:50%;width:32px;height:32px;color:#69697f;font-size:21px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.formfield{margin-bottom:13px;min-width:0}.formfield label{display:block;font-weight:750;font-size:12px;margin:0 0 6px;color:#4b4b63}.formfield input,.formfield select,.formfield textarea{width:100%;background:#fff;border:1px solid #dbdbe8;border-radius:11px;padding:12px 10px;color:var(--ink);min-height:44px;font-size:14px}.formfield textarea{resize:vertical;min-height:125px;line-height:1.55}.formfield input[type="checkbox"]{width:auto;min-height:0;accent-color:var(--primary)}.formfield.checkbox label{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:650}.help{font-size:11px;color:var(--muted);line-height:1.6;margin:5px 0 13px}.error{color:#bd3347;font-size:12px;margin:7px 0}.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pilltabs{display:flex;gap:6px;background:#efeff5;border-radius:12px;padding:4px;margin:12px 0}.pilltabs button{flex:1;border:0;border-radius:9px;padding:8px;background:transparent;color:#6d6b7e;font-size:12px;font-weight:750}.pilltabs button.active{background:white;color:var(--primary);box-shadow:0 1px 4px #32325317}.footnote{font-size:11px;color:#86869a;line-height:1.7}.tablebox{overflow:auto;border:1px solid var(--border);border-radius:12px}.simpletable{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}.simpletable th,.simpletable td{text-align:left;padding:10px;border-bottom:1px solid var(--border)}.simpletable th{background:#f7f6ff;color:#6c6898}.simpletable tr:last-child td{border-bottom:0}.simpletable input,.simpletable select{border:1px solid #dcdce8;border-radius:7px;padding:7px;font-size:12px;background:white;max-width:160px}.dangerzone{margin-top:18px;padding:14px;border:1px dashed #f0bdc4;border-radius:14px}.notice{position:fixed;bottom:calc(92px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#2c2a48;color:white;border-radius:13px;padding:12px 17px;font-size:12px;z-index:100;box-shadow:0 12px 20px #0003;width:max-content;max-width:88vw;pointer-events:none}.no-split{white-space:nowrap}.mini-act{border:0;background:#f5f3ff;color:#5f53b9;font-size:12px;font-weight:750;border-radius:9px;padding:8px 10px}.flexwrap{flex-wrap:wrap}.right{text-align:right}.mt{margin-top:12px}.statline{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:9px 0;font-size:13px}.statline strong{font-size:14px}.checkboxline{display:flex;align-items:center;gap:7px}.hide{display:none!important}
.vendor-tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:7px}.vendor-tools .stockout-toggle{font-size:11px}.delay-toggle{display:inline-flex;align-items:center;gap:5px;background:#fff7e9;border:1px solid #f3dbac;padding:6px 9px;border-radius:10px;font-size:12px;font-weight:800;color:#9a6519;min-height:34px;white-space:nowrap}.delay-toggle input{accent-color:#b26b12;width:17px;height:17px;margin:0}.price-pending{font-size:12px;color:#b26b12;font-weight:800}.multi-line{background:#fafaff;border:1px solid #e9e6fa;border-radius:13px;padding:12px;margin:10px 0}.multi-line .formfield{margin-bottom:8px}.stockout-row{background:#fffafa}.stockout-row .name{text-decoration:line-through;color:#8d8d9e}.stockout-row .number{color:#a1a0af}.stockout-toggle{display:inline-flex;align-items:center;gap:5px;background:#f5f5f8;border:1px solid #e8e8ee;padding:6px 9px;border-radius:10px;font-size:12px;font-weight:800;color:#67677c;min-height:34px;white-space:nowrap}.stockout-toggle.checked{background:#fff0f2;color:#bf3b50;border-color:#f2cfd5}.stockout-toggle input{accent-color:#d84b59;width:17px;height:17px;margin:0}.tagrow .stockout-toggle{margin-top:4px}.refund-note{background:#fff0f2;border:1px solid #f5d7dc;border-radius:12px;padding:10px 12px;color:#ae3447;font-size:12px;line-height:1.5;margin-top:9px}.summary-alert{color:var(--danger);font-weight:800}
@media(min-width:700px){.top{border-radius:0 0 27px 27px}.modal{border-radius:22px;margin-bottom:25px;max-height:85vh}.modalouter{align-items:center}.wrap{box-shadow:0 0 70px #dad9eb80}}

<body>
<div id="app"></div>
<div id="modalMount"></div>
<div id="toastMount"></div>
<script>
'use strict';
const KEY='gonggunote.v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won=v=>(Math.round(Number(v)||0)).toLocaleString('ko-KR')+'원';
const money=v=>Math.max(0,Math.round(Number(String(v??'').replace(/[^0-9.-]/g,''))||0));
const optionalPrice=v=>v===undefined||v===null||String(v).trim()===''?null:money(v);
const priced=o=>o.price!==null&&o.price!==undefined&&o.price!=='';
const priceText=p=>p===null||p===undefined||p===''?'가격 미입력':won(p);
const unpriced=(b,n)=>b.orders.filter(o=>o.buyer===n&&!o.soldOut&&!priced(o));
const uid=()=>('id'+Date.now().toString(36)+Math.random().toString(36).slice(2,9));
const today=()=>new Date().toISOString().slice(0,10);
const initial=()=>{let b={id:uid(),name:'새 공동구매',created:today(),archived:false,products:[],orders:[],payments:{},refunds:{}};return{version:2,activeId:b.id,batches:[b]}};
function validState(s){return s&&Array.isArray(s.batches)&&s.batches.length&&s.batches.every(b=>Array.isArray(b.products)&&Array.isArray(b.orders)&&b.payments&&typeof b.payments==='object'&&typeof b.name==='string')}
let data;try{const d=JSON.parse(localStorage.getItem(KEY));data=validState(d)?d:initial()}catch(e){data=initial()}
// 예전 버전의 0원 주문은 판매가 미입력으로 한 번만 이전합니다.
if((data.version||1)<2){for(const b of data.batches){b.refunds=b.refunds||{};for(const p of b.products){if(p.price===0)p.price=null}for(const o of b.orders){if(o.price===0)o.price=null;if(o.delayed!==true&&o.productId&&catalogPlaceholder(b,o)?.delayed)o.delayed=true}}data.version=2;try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
function catalogPlaceholder(b,o){return b.products.find(p=>p.id===o.productId)}
function linkCatalogOrders(b,p){const key=normalize(labelProduct(p));let attached=0;for(const o of b.orders){if(!o.productId&&normalize(o.customName||'')===key){o.productId=p.id;o.customName='';if(!priced(o)&&priced(p))o.price=p.price;if(p.delayed)o.delayed=true;attached++}}return attached}
let view='home',orderSearch='',productSearch='',openBuyers={},bulkRows=[],modalType='',toastTimer=null;
const batch=()=>data.batches.find(b=>b.id===data.activeId)||data.batches[0];
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('이 브라우저의 저장 공간이 제한되어 있어요. 설정에서 백업 파일을 먼저 내려받아 주세요.')}}
const catalog=(b,pid)=>b.products.find(p=>p.id===pid);
function labelProduct(p){return [p.name,p.color,p.size].filter(Boolean).join(' ')}
function lineLabel(b,o){return o.productId&&catalog(b,o.productId)?labelProduct(catalog(b,o.productId)):o.customName||'상품 미지정'}
function delayedLine(b,o){return o.delayed!==undefined&&o.delayed!==null?!!o.delayed:!!catalog(b,o.productId)?.delayed}
function buyers(b){let names=[];for(const o of b.orders){if(o.buyer&&!names.includes(o.buyer))names.push(o.buyer)}return names}
function orderSub(b,n){return b.orders.filter(o=>o.buyer===n&&!o.soldOut).reduce((v,o)=>v+money(o.price)*Math.max(1,money(o.qty)),0)}
function owed(b,n){return orderSub(b,n)}
function paid(b,n){return Math.min(1e12,money(b.payments[n]))}
function refunded(b,n){return Math.min(paid(b,n),money(b.refunds?.[n]))}
function netPaid(b,n){return Math.max(0,paid(b,n)-refunded(b,n))}
function refundNeeded(b,n){return unpriced(b,n).length?0:Math.max(0,netPaid(b,n)-owed(b,n))}
function pending(b,n){return Math.max(0,owed(b,n)-netPaid(b,n))}
function paidStatus(b,n){const due=owed(b,n),got=netPaid(b,n);if(unpriced(b,n).length)return 'unpriced';if(got>due)return 'refund';if(due===0)return 'soldout';return got>=due?'paid':got>0?'part':'unpaid'}
function allStats(b){const ns=buyers(b);const total=ns.reduce((s,n)=>s+owed(b,n),0),received=ns.reduce((s,n)=>s+netPaid(b,n),0),done=ns.filter(n=>paidStatus(b,n)==='paid').length;const remain=ns.reduce((s,n)=>s+pending(b,n),0),refund=ns.reduce((s,n)=>s+refundNeeded(b,n),0),soldout=b.orders.filter(o=>o.soldOut).reduce((s,o)=>s+money(o.qty),0),unknown=b.orders.filter(o=>!o.soldOut&&!priced(o)).length;return{count:ns.length,total,received,remain,done,refund,soldout,unknown}}
function stockStats(b){return b.products.map(p=>{const used=b.orders.filter(o=>o.productId===p.id&&!o.soldOut).reduce((s,o)=>s+money(o.qty),0);const supplied=money(p.supplierQty),qtyKnown=p.supplierQty!==null&&p.supplierQty!==undefined;return{...p,used,supplied,qtyKnown,left:qtyKnown?Math.max(0,supplied-used):0,short:qtyKnown?Math.max(0,used-supplied):0}})}
const statusBadge=s=>s==='unpriced'?'<span class="badge orange">가격 입력 필요</span>':s==='paid'?'<span class="badge green">입금 완료</span>':s==='part'?'<span class="badge orange">일부 입금</span>':s==='refund'?'<span class="badge red">환불 필요</span>':s==='soldout'?'<span class="badge">품절 처리</span>':'<span class="badge">미입금</span>';
const delayBadge=d=>d?'<span class="badge orange">※ 미송</span>':'';
const soldoutBadge=d=>d?'<span class="badge red">품절 · 정산 제외</span>':'';
function toast(msg){$('#toastMount').innerHTML=`<div class="notice">${esc(msg)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toastMount').innerHTML='',2500)}
function changeView(v){view=v;orderSearch='';productSearch='';render();window.scrollTo({top:0,behavior:'smooth'})}
function saveRender(){save();render()}
function render(){let b=batch(),st=allStats(b);$('#app').innerHTML=`<main class="wrap">
<header class="top"><div class="topbrand"><div><div class="brand">🛍️ 공구노트</div><div class="subbrand">사장님 전용 · 주문 및 거래처 상태 관리</div></div><button class="ghostlight" data-action="backup">백업 ⤓</button></div>
<div class="batchrow"><select id="batchPick" aria-label="공동구매 선택">${data.batches.map(x=>`<option value="${esc(x.id)}" ${x.id===b.id?'selected':''}>${esc(x.name)}${x.archived?' · 완료':''}</option>`).join('')}</select><button data-action="batch-add" aria-label="공동구매 새로 만들기">+</button></div></header>
<div class="content">${b.archived?'<div class="banner">🔒 완료 처리한 공구예요. 확인과 수정은 가능하지만 신규 공구는 상단 +에서 따로 만드세요.</div>':''}${({home:renderHome,orders:renderOrders,products:renderProducts,payments:renderPayments,settings:renderSettings})[view](b,st)}</div>
<nav class="bottom" aria-label="메뉴">${[['home','⌂','홈'],['orders','🧾','주문'],['products','📦','상품·수량'],['payments','💳','입금'],['settings','⚙️','설정']].map(([id,icon,title])=>`<button class="nav ${view===id?'active':''}" data-view="${id}"><span class="symbol">${icon}</span><span>${title}</span></button>`).join('')}</nav></main>`}
function renderHome(b,s){const stats=stockStats(b),shorts=stats.filter(x=>x.short>0),lefts=stats.filter(x=>x.left>0),delayed=stats.filter(x=>x.delayed);return `<div class="sectiontop"><div class="h2">공구 현황</div><span class="badge">${esc(b.created)}</span></div><div class="kpis"><div class="kpi purple"><span class="small">확정된 청구액</span><strong>${won(s.total)}</strong></div><div class="kpi green"><span class="small">실수령액</span><strong>${won(s.received)}</strong></div><div class="kpi"><span class="small">확정 금액 중 미입금</span><strong>${won(s.remain)}</strong></div><div class="kpi"><span class="small">입금 완료</span><strong>${s.done} / ${s.count}명</strong></div></div>
${s.unknown?`<div class="banner">💡 가격 미입력 주문이 <b>${s.unknown}건</b> 있어요. 금액은 임시 합계이며 가격을 입력해야 정확한 청구·입금 완료 처리가 가능해요.</div>`:''}<div class="card"><div class="row between"><strong style="font-size:14px">📋 빠른 등록</strong><span class="small">공구별 자동 정리</span></div><div class="quickgrid mt"><button class="quick" data-action="order-add"><span class="emoji">➕</span>주문 추가</button><button class="quick" data-action="order-bulk"><span class="emoji">📋</span>카톡 복붙</button><button class="quick" data-action="product-add"><span class="emoji">📦</span>상품 등록</button><button class="quick" data-action="product-bulk"><span class="emoji">🧾</span>발주표 복붙</button></div></div>
<div class="card"><div class="row between"><strong>상품 수량 확인</strong><button class="textbtn" data-view="products">자세히 ›</button></div><div class="statline"><span class="muted">수량 부족 상품</span><strong style="color:${shorts.length?'var(--danger)':'var(--green)'}">${shorts.length}종</strong></div><div class="statline"><span class="muted">남는 상품</span><strong>${lefts.length}종 / ${lefts.reduce((s,x)=>s+x.left,0)}개</strong></div><div class="statline"><span class="muted">※ 미송 상품 / 주문</span><strong>${delayed.length}종 / ${b.orders.filter(o=>!o.soldOut&&delayedLine(b,o)).length}건</strong></div><div class="statline"><span class="muted">품절 처리한 고객 주문</span><strong>${s.soldout}개</strong></div>${s.refund?`<div class="refund-note">💸 환불 필요한 금액: <b>${won(s.refund)}</b></div>`:''}${shorts.slice(0,3).map(x=>`<div class="product-row"><div class="name">${esc(labelProduct(x))}</div><span class="badge red">${x.short}개 부족</span></div>`).join('')}${!stats.length?'<div class="hint">먼저 상품의 발주 수량을 등록하고 주문을 넣으면 남는 상품·부족한 상품이 자동 계산돼요.</div>':''}</div>
${!s.count?'<div class="card"><div style="font-size:21px">👋</div><div class="name" style="margin:8px 0">처음 사용하는 방법</div><div class="small">① <b>주문</b>에서 한 사람의 여러 상품을 한 번에 등록(가격은 나중에 입력 가능)<br>② 거래처에서 안내받으면 <b>사장님이 직접</b> 미송·품절 체크<br>③ <b>상품·수량</b>에서 발주 수량을 입력해 남음·부족 비교<br>④ 가격 입력 후 <b>입금</b>에서 정산</div></div>':''}`}
function renderOrders(b,s){let names=buyers(b).filter(n=>!orderSearch||n.toLowerCase().includes(orderSearch.toLowerCase())||b.orders.some(o=>o.buyer===n&&lineLabel(b,o).toLowerCase().includes(orderSearch.toLowerCase())));return `<div class="sectiontop"><span class="h2">주문 관리 <small class="muted">${s.count}명</small></span><div class="row"><button class="btn light sm" data-action="order-bulk">카톡 붙여넣기</button><button class="btn sm" data-action="order-add">+ 주문자·상품</button></div></div><input class="search" id="orderSearch" placeholder="주문자 이름 또는 상품 검색" value="${esc(orderSearch)}" aria-label="주문 검색"><div class="hint">🔐 <b>주문자가 사용하는 화면이 아닌 사장님 관리 화면</b>이에요. 주문자는 상품명·사이즈·수량만 보내면 돼요. <b>상품 단가는 나중에 입력</b>해도 되고, 거래처에서 안내받은 <b>미송·품절은 사장님이 직접 체크</b>하세요. 2개 중 1개만 품절이면 주문을 1개씩 나눠 체크해 주세요.</div><div class="orderlist">${!names.length?'<div class="empty"><div class="emoji">🧾</div>등록된 주문이 없어요.<br>+ 주문자·상품 버튼으로 시작해 보세요.</div>':''}${names.map(n=>{let lines=b.orders.filter(o=>o.buyer===n),shown=openBuyers[n]!==false,status=paidStatus(b,n),pendingPrices=unpriced(b,n).length;return `<section class="buyerblock"><button class="buyerhead" data-action="buyer-toggle" data-buyer="${esc(n)}"><span class="chevron">${shown?'⌄':'›'}</span><div class="grow"><div class="name">${esc(n)} <span class="small">${lines.reduce((v,o)=>v+money(o.qty),0)}개${lines.some(o=>o.soldOut)?` · 품절 ${lines.filter(o=>o.soldOut).reduce((v,o)=>v+money(o.qty),0)}개`:''}</span></div><div class="meta">${won(owed(b,n))}${pendingPrices?' + 가격 미정':''}</div></div>${statusBadge(status)}</button>${shown?`<div class="buyerbody">${lines.map(o=>`<div class="order-row ${o.soldOut?'stockout-row':''}"><div class="grow"><div class="name">${esc(lineLabel(b,o))}</div><div class="tagrow">${soldoutBadge(o.soldOut)}${o.soldOut?'':delayBadge(delayedLine(b,o))}<span class="meta">${priceText(o.price)} × ${o.qty}개</span></div><div class="vendor-tools"><label class="delay-toggle"><input type="checkbox" data-delay-toggle data-id="${esc(o.id)}" ${delayedLine(b,o)?'checked':''} aria-label="${esc(lineLabel(b,o))} 미송 처리">※ 미송</label><label class="stockout-toggle ${o.soldOut?'checked':''}"><input type="checkbox" data-stockout-toggle data-id="${esc(o.id)}" ${o.soldOut?'checked':''} aria-label="${esc(lineLabel(b,o))} 품절 처리">품절</label></div></div><div class="right"><div class="number">${o.soldOut?'청구 제외':priced(o)?won(money(o.price)*money(o.qty)):'가격 미정'}</div><button class="textbtn" data-action="order-edit" data-id="${esc(o.id)}">수정</button></div></div>`).join('')}${pendingPrices?`<div class="hint">가격 미입력 ${pendingPrices}건 · 청구액은 아직 미확정이에요.</div>`:''}${refundNeeded(b,n)?`<div class="refund-note">💸 ${esc(n)}님 환불 필요 <b>${won(refundNeeded(b,n))}</b></div>`:''}<div class="row between mt flexwrap"><button class="btn sm" data-action="order-add" data-buyer="${esc(n)}">+ ${esc(n)} 상품 추가</button><button class="btn light sm" data-action="bill-copy" data-buyer="${esc(n)}">정산 복사</button><button class="btn neutral sm" data-action="payment-edit" data-buyer="${esc(n)}">입금 관리</button></div></div>`:''}</section>`}).join('')}</div>`}
function renderProducts(b){let ss=stockStats(b).filter(p=>!productSearch||labelProduct(p).toLowerCase().includes(productSearch.toLowerCase()));return `<div class="sectiontop"><div class="h2">상품·발주 수량</div><div class="row"><button class="btn light sm" data-action="product-bulk">표 붙여넣기</button><button class="btn sm" data-action="product-add">+ 등록</button></div></div><input class="search" id="productSearch" placeholder="상품명·색상·사이즈 검색" value="${esc(productSearch)}" aria-label="상품 검색"><div class="hint">발주 수량 = 거래처에 주문한 수량(미송 포함). <b>남음 = 발주 − 고객 주문</b>, <b>부족 = 고객 주문 − 발주</b>예요. ※ 표시는 미송으로 따로 관리돼요. <b>품절 처리된 주문은 고객 주문 수량에서 제외</b>돼요. 거래처에도 취소했다면 발주 수량을 직접 수정해 주세요.</div>${!ss.length?'<div class="empty"><div class="emoji">📦</div>상품이 없어요.<br>상품을 등록하거나 발주표를 붙여넣어 주세요.</div>':''}${ss.map(p=>`<div class="card"><div class="row between"><div class="grow"><div class="name">${esc(labelProduct(p))}</div><div class="meta">단가 ${priceText(p.price)}</div></div><button class="btn neutral sm" data-action="product-edit" data-id="${esc(p.id)}">수정</button></div><div class="tagrow">${delayBadge(p.delayed)}${p.short?`<span class="badge red">${p.short}개 부족</span>`:''}${p.left?`<span class="badge green">${p.left}개 남음</span>`:''}${!p.qtyKnown?'<span class="badge orange">발주 수량 미입력</span>':!p.left&&!p.short?'<span class="badge">수량 일치</span>':''}</div><div class="divider"></div><div class="split"><div><span class="small">거래처 발주</span><div class="number" style="margin-top:5px">${p.qtyKnown?p.supplied+'개':'미입력'}</div></div><div><span class="small">고객 주문</span><div class="number" style="margin-top:5px">${p.used}개</div></div></div></div>`).join('')}`}
function renderPayments(b,s){return `<div class="sectiontop"><div class="h2">입금·환불 정산</div></div>${s.unknown?`<div class="banner">⚠️ 아직 가격을 입력하지 않은 주문이 <b>${s.unknown}건</b> 있어요. 아래 금액은 입력된 상품만 합산한 <b>임시 금액</b>이에요. 전액 입금 처리는 가격 확정 후 가능해요.</div>`:''}<div class="card"><div class="statline"><span>확정된 청구액 (품절 제외)</span><strong>${won(s.total)}</strong></div><div class="statline"><span>실수령액 (환불 차감)</span><strong style="color:var(--green)">${won(s.received)}</strong></div><div class="divider"></div><div class="statline"><strong>확정금액 중 미입금</strong><strong style="color:${s.remain?'var(--danger)':'var(--green)'}">${won(s.remain)}</strong></div>${s.refund?`<div class="refund-note">💸 환불 필요 총액: <b>${won(s.refund)}</b></div>`:''}<div class="meter"><div style="width:${s.total?Math.max(0,Math.min(100,(s.total-s.remain)/s.total*100)):0}%"></div></div><div class="small">배송비 분배 없음 · 품절은 청구 제외 · 금액 미입력은 정산 미확정</div></div><div class="card"><strong style="font-size:14px">주문자별 정산</strong>${buyers(b).map(n=>{let due=owed(b,n),got=paid(b,n),status=paidStatus(b,n),returnDue=refundNeeded(b,n),waiting=unpriced(b,n).length;return `<div class="buyer-row"><div class="grow"><div class="name">${esc(n)} ${statusBadge(status)}</div><div class="meta">${waiting?`가격 미입력 ${waiting}건 · `:''}상품 청구 ${won(due)} · 품절 ${b.orders.filter(o=>o.buyer===n&&o.soldOut).reduce((s,o)=>s+money(o.price)*money(o.qty),0).toLocaleString('ko-KR')}원</div><div class="meta">입금 ${won(got)}${refunded(b,n)?` · 환불 완료 ${won(refunded(b,n))}`:''}</div></div><div class="right"><div class="number" style="color:${returnDue?'var(--danger)':''}">${waiting?'가격 입력 필요':returnDue?'환불 '+won(returnDue):pending(b,n)?'미입금 '+won(pending(b,n)):'정산 완료'}</div><button class="mini-act" data-action="payment-edit" data-buyer="${esc(n)}">입금·환불 수정</button><div style="margin-top:5px"><button class="textbtn" data-action="bill-copy" data-buyer="${esc(n)}">안내 복사</button></div></div></div>`}).join('')}${!s.count?'<div class="empty">주문을 추가하면 정산표가 자동으로 나타나요.</div>':''}</div>`}
function renderSettings(b){return `<div class="sectiontop"><div class="h2">공구 설정</div></div><div class="card"><div class="statline"><span>공구 이름</span><strong>${esc(b.name)}</strong></div><div class="statline"><span>상품 / 주문</span><strong>${b.products.length}종 / ${b.orders.length}건</strong></div><div class="row mt flexwrap"><button class="btn light sm" data-action="batch-edit">공구 이름 수정</button><button class="btn neutral sm" data-action="batch-archive">${b.archived?'완료 해제':'정산 완료 처리'}</button></div></div><div class="card"><strong>💾 백업 및 내보내기</strong><p class="small">입력 내용은 이 기기의 브라우저에 저장돼요. 사파리 데이터를 지우거나 기기를 바꾸면 없어질 수 있으니 정기적으로 백업해 주세요.</p><div class="stack"><button class="btn light full" data-action="backup">전체 데이터 백업 (.json)</button><button class="btn neutral full" data-action="csv">현재 공구 주문표 (.csv)</button><button class="btn neutral full" data-action="restore">백업 파일 불러오기 (.json)</button></div><input type="file" id="restoreFile" accept=".json,application/json" class="hide"></div><div class="card"><strong>📱 아이폰 홈 화면에 추가하기</strong><p class="small">이 앱을 <b>HTTPS 웹주소에 게시한 뒤</b> Safari에서 열고 공유 버튼 → ‘홈 화면에 추가’를 선택하면 앱 아이콘으로 실행할 수 있어요. 내려받은 HTML 파일을 열기만 해서는 홈 화면 설치나 안정적인 데이터 저장이 제한될 수 있어요.</p></div><div class="card"><strong>💬 복사해서 한 번에 등록</strong><p class="small">카톡 주문은 <b>이름 - 상품명 색상 사이즈 1개, 다음 상품 1개</b> 형식으로 붙여넣을 수 있어요. 주문자가 상품명·색상·사이즈·수량만 적어도 돼요. 가격은 빈칸으로 등록한 뒤 사장님이 직접 입력할 수 있어요. 미송·품절은 거래처 안내를 받고 사장님만 체크해요.</p></div><div class="dangerzone"><strong style="color:var(--danger)">현재 공구 삭제</strong><p class="footnote">이 공구의 상품·주문·입금 기록이 삭제돼요. 먼저 백업을 권장해요.</p><button class="btn danger sm" data-action="batch-delete">공구 삭제</button></div>`}
function modal(title,html){$('#modalMount').innerHTML=`<div class="modalouter" role="presentation"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modalhead"><h2>${esc(title)}</h2><button class="close" data-action="modal-close" aria-label="닫기">×</button></div>${html}</div></div>`;modalType=title;setTimeout(()=>{let x=$('#modalMount input:not([type="checkbox"]),#modalMount textarea');if(x)x.focus({preventScroll:true})},40)}
function closeModal(){modalType='';bulkRows=[];$('#modalMount').innerHTML=''}
function field(name,label,value='',type='text',placeholder=''){return `<div class="formfield"><label for="${name}">${label}</label><input id="${name}" name="${name}" type="${type}" ${type==='number'?'min="0" step="1"':''} value="${esc(value)}" placeholder="${esc(placeholder)}"></div>`}
function productModal(id){let b=batch(),p=id?catalog(b,id):null;modal(p?'상품 수정':'상품 등록',`<form id="productForm" data-id="${esc(id||'')}">${field('pname','상품명 *',p?.name||'','text','예: 하트호피 전신슈트')}<div class="formgrid">${field('pcolor','색상',p?.color||'','text','크림')}${field('psize','사이즈',p?.size||'','text','BM')}</div><div class="formgrid">${field('pprice','판매 단가(원) · 나중에 입력 가능',p?.price??'','number','미입력 가능')}${field('psupplier','거래처 발주수량 · 나중에 입력 가능',p?.supplierQty??'','number','미입력 가능')}</div><div class="formfield checkbox"><label><input type="checkbox" id="pdelayed" ${p?.delayed?'checked':''}> ※ 거래처 미송 (연결된 고객 주문에도 반영)</label></div><div class="row"><button type="submit" class="btn grow">${p?'변경 저장':'상품 등록'}</button>${p?`<button type="button" class="btn danger" data-action="product-delete" data-id="${esc(p.id)}">삭제</button>`:''}</div><p class="help">미송은 사장님이 거래처 연락을 받고 표시해요. 가격은 나중에 등록해도 괜찮아요. 상품·색상·사이즈별로 등록하면 발주 수량을 비교할 수 있어요.</p></form>`)}
function orderModal(id,buyer){let b=batch(),o=id?b.orders.find(x=>x.id===id):null,sel=o?.productId||'';modal(o?'상품 주문 수정':'상품 주문 추가',`<form id="orderForm" data-id="${esc(id||'')}">${field('obuyer','주문자 이름 *',o?.buyer||buyer||'','text','예: 주영')}<div class="formfield"><label for="oproduct">등록된 상품 연결(선택사항)</label><select id="oproduct" name="oproduct"><option value="">직접 입력 (상품표에 없는 품목)</option>${b.products.map(p=>`<option value="${esc(p.id)}" ${sel===p.id?'selected':''}>${esc(labelProduct(p))} · ${priceText(p.price)}</option>`).join('')}</select></div><div id="customNameWrap" class="${sel?'hide':''}">${field('ocustom','상품명·색상·사이즈 *',o?.customName||'','text','예: 레인보우삭스 어텀 XS')}</div><div class="formgrid">${field('oqty','수량 *',o?.qty||1,'number')}${field('oprice','개당 가격(원) · 선택',o?.price??'','number','나중에 입력')}</div><div class="hint">📦 거래처 안내 사항은 <b>사장님이 직접</b> 체크해요.</div><div class="formfield checkbox"><label><input id="odelayed" type="checkbox" ${o?.delayed?'checked':''}> ※ 미송 · 거래처에서 아직 입고 안 됨</label></div><div class="formfield checkbox"><label><input id="osoldout" type="checkbox" ${o?.soldOut?'checked':''}> 🔴 품절 · 해당 주문 청구 제외</label></div><div class="row"><button type="submit" class="btn grow">${o?'변경 저장':'주문 추가'}</button>${o?`<button type="button" class="btn danger" data-action="order-delete" data-id="${esc(o.id)}">삭제</button>`:''}</div><p class="help">가격 미입력 주문은 그대로 저장돼요. 품절 시 기록은 유지하고 청구액에서 제외하며 입금된 금액은 환불 필요액을 계산해요.</p></form>`);$('#oproduct').addEventListener('change',()=>{let p=catalog(b,$('#oproduct').value);$('#customNameWrap').classList.toggle('hide',!!p);if(p){$('#oprice').value=p.price??'';$('#odelayed').checked=!!p.delayed}})}
function multiRowTemplate(b){return `<div class="multi-line"><div class="row between"><strong style="font-size:13px">주문 상품</strong><button type="button" class="textbtn" data-action="multi-row-remove">이 상품 삭제</button></div><div class="formfield"><label>등록된 상품 선택 (선택사항)</label><select class="multi-product"><option value="">직접 입력</option>${b.products.map(p=>`<option value="${esc(p.id)}">${esc(labelProduct(p))} · ${priceText(p.price)}</option>`).join('')}</select></div><div class="formfield"><label>상품명·색상·사이즈</label><input class="multi-name" type="text" placeholder="예: 하트호피 전신슈트 크림 BM"></div><div class="formgrid"><div class="formfield"><label>수량 *</label><input class="multi-qty" type="number" min="1" value="1"></div><div class="formfield"><label>판매 단가(원) · 선택</label><input class="multi-price" type="number" min="0" placeholder="나중에 입력"></div></div></div>`}
function multiOrderModal(buyer=''){let b=batch();modal('주문자 · 여러 상품 등록',`<form id="multiOrderForm">${field('multiBuyer','주문자 이름 *',buyer,'text','예: 설하맘언니')}<div class="hint">한 사람의 상품을 <b>여러 개 한 번에</b> 추가할 수 있어요. <b>가격은 비워두고 저장 가능</b>해요. 거래처 미송·품절 체크는 주문 저장 후 사장님이 직접 해요.</div><div id="multiRows">${multiRowTemplate(b)}</div><button type="button" class="btn light full" data-action="multi-row-add">+ 이 주문자에게 상품 더 추가</button><button type="submit" class="btn full mt">주문 상품 모두 저장</button></form>`)}
function paymentModal(n){let b=batch(),unknown=unpriced(b,n).length;modal(n+' 입금·환불 관리',`<form id="paymentForm" data-buyer="${esc(n)}">${unknown?`<div class="banner">가격 미입력 ${unknown}건 · 청구액 미확정이에요. 실제 입금 기록은 남길 수 있지만 전액 입금 처리는 가격 입력 후 가능해요.</div>`:''}<div class="card" style="box-shadow:none"><div class="statline"><span>청구 금액 (가격 입력된 상품)</span><strong>${won(owed(b,n))}${unknown?' + 미정':''}</strong></div><div class="statline"><span>입금받은 금액</span><strong>${won(paid(b,n))}</strong></div><div class="statline"><span>환불 완료 금액</span><strong>${won(refunded(b,n))}</strong></div>${refundNeeded(b,n)?`<div class="refund-note">💸 현재 환불 필요 <b>${won(refundNeeded(b,n))}</b></div>`:''}</div>${field('paidvalue','실제로 입금받은 총 금액 (원)',paid(b,n),'number')}${field('refundvalue','실제로 환불한 총 금액 (원)',refunded(b,n),'number')}<div class="row"><button type="button" class="btn light grow" data-action="mark-full" data-buyer="${esc(n)}" ${unknown?'disabled':''}>전액 입금</button><button type="submit" class="btn grow">금액 저장</button></div>${refundNeeded(b,n)?`<button type="button" class="btn neutral full mt" data-action="mark-refund" data-buyer="${esc(n)}">${won(refundNeeded(b,n))} 환불 완료로 기록</button>`:''}<p class="help">환불은 자동 송금되지 않아요. 실제로 송금한 뒤 환불 완료로 기록하세요.</p></form>`)}
function batchModal(kind){let b=batch();modal(kind==='add'?'새 공동구매 만들기':'공구 설정 변경',`<form id="batchForm" data-kind="${kind}">${field('batchname','공구 이름 *',kind==='add'?'':b.name,'text','예: 11월 아동복 공구')}<button type="submit" class="btn full">${kind==='add'?'새 공구 만들기':'변경 저장'}</button></form>`)}
function productBulkModal(){modal('발주표 여러 개 등록',`<p class="small">한 줄에 하나씩 아래 순서로 입력해요. 미송이면 마지막에 <b>※</b>를 써주세요.</p><div class="hint">상품명 | 색상 | 사이즈 | 판매가(비워도 됨) | 발주수량 | 미송<br>하트호피 전신슈트 | 크림 | BM | 22000 | 2 | ※<br>레인보우삭스 | 어텀 | XS | 7000 | 1</div><form id="productBulkForm"><div class="formfield"><label for="productText">붙여넣기</label><textarea id="productText" rows="8" placeholder="하트호피 전신슈트 | 크림 | BM | 22000 | 2 | ※"></textarea></div><button class="btn full" type="submit">등록 내용 확인하기</button></form><div id="productBulkPreview"></div>`)}
function productBulkPreview(rows){const bad=rows.filter(r=>!r.name||r.price<0||r.supplierQty<0);$('#productBulkPreview').innerHTML=`<p class="small">${rows.length}종 인식 / ${bad.length}종 확인 필요. 같은 상품명·색상·사이즈가 이미 있으면 발주수량을 <b>더하지 않고 덮어씁니다</b>.</p><div class="tablebox"><table class="simpletable"><tr><th>상품·옵션</th><th>단가</th><th>발주</th><th>미송</th></tr>${rows.map(r=>`<tr><td>${esc(labelProduct(r))}</td><td>${priceText(r.price)}</td><td>${r.supplierQty??'미입력'}${r.supplierQty==null?'':'개'}</td><td>${r.delayed?'※':'-'}</td></tr>`).join('')}</table></div><button class="btn full mt" id="productBulkCommit" ${bad.length||!rows.length?'disabled':''}>${rows.length}종 등록 확정</button>`;$('#productBulkCommit').onclick=()=>{let b=batch();rows.forEach(r=>{let p=b.products.find(p=>normalize(labelProduct(p))===normalize(labelProduct(r)));if(p){Object.assign(p,{...r,id:p.id});linkCatalogOrders(b,p)}else{const item={...r,id:uid()};b.products.push(item);linkCatalogOrders(b,item)}});closeModal();saveRender();toast(rows.length+'종 상품을 등록했어요')};}
function normalize(s){return String(s||'').toLowerCase().replace(/[\s\[\](){}.,_\-–~·]/g,'')}
function parseProductLines(text){return text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).map(x=>{let v=x.split('|').map(z=>z.trim());if(v[0]?.includes('상품명')&&v[1]?.includes('색상'))return null;return{name:v[0]||'',color:v[1]||'',size:v[2]||'',price:optionalPrice(v[3]),supplierQty:v[4]===''||v[4]===undefined?null:money(v[4]),delayed:(v[5]||'').includes('※')||/미송|대기/i.test(v[5]||'')}}).filter(Boolean)}
function bulkOrderModal(){bulkRows=[];modal('카톡 주문 한 번에 등록',`<p class="small">주문 내용을 붙여넣고 인식된 상품·금액을 확인하세요. 상품표에 등록된 품목이면 자동 연결돼요. 가격은 나중에 입력해도 돼요.</p><div class="hint">주영 - 하트호피 전신슈트 크림 BM 1개<br>다안 - 하트호피 전신슈트 크림 BS 1개, 찹쌀떡 알라딘 크림블루 XS 1개<br><br><b>정확한 표 형식도 가능</b><br>주영 | 하트호피 전신슈트 | 크림 | BM | 1</div><form id="bulkOrderForm"><div class="formfield"><label for="bulkOrderText">카톡 주문 내용</label><textarea id="bulkOrderText" rows="7" placeholder="주영 - 하트호피 전신슈트 크림 BM 1개"></textarea></div><button class="btn full" type="submit">주문 내용 분석하기</button></form><div id="bulkOrderPreview"></div>`)}
function matchProduct(b,label){let n=normalize(label);if(!n)return null;let ranked=b.products.map(p=>{let pl=normalize(labelProduct(p)), score=0;if(n===pl)score=1000;else if(n.includes(pl)&&pl.length>2)score=500+pl.length;else if(pl.includes(n)&&n.length>3)score=200+n.length;else{const words=[p.name,p.color,p.size].filter(Boolean);let hits=words.filter(w=>n.includes(normalize(w))).length;if(hits===words.length&&hits>0)score=100+hits*5}return {p,score}}).filter(x=>x.score>0).sort((x,y)=>y.score-x.score);if(!ranked.length||ranked.length>1&&ranked[0].score===ranked[1].score)return null;return ranked[0].p}
function parseOrderLines(text){let b=batch(),out=[],unread=[];text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).forEach(line=>{if(line.startsWith('//')||line.startsWith('#'))return;let buyer='',items=[];let pieces=line.split('|').map(x=>x.trim());if(pieces.length>=4){buyer=pieces[0];let q=pieces[pieces.length-1].match(/^\d+\s*(개|장|벌|켤레)?$/);if(q){let qty=money(q[0]);items=[{label:pieces.slice(1,-1).filter(Boolean).join(' '),qty}]}else{unread.push(line);return}}else{let m=line.match(/^(.+?)\s*[-–:：]\s*(.+)$/);if(!m){unread.push(line);return}buyer=m[1].trim();items=m[2].split(/[,，]/).map(z=>z.trim()).filter(Boolean).map(t=>{let q=t.match(/^(.*?)(?:\s+)(\d+)\s*(?:개|장|벌|켤레)?\s*$/);return{label:q?q[1].trim():t,qty:q?money(q[2]):1}})}if(!buyer){unread.push(line);return}items.forEach(x=>{let p=matchProduct(b,x.label);out.push({buyer,label:x.label,qty:x.qty||1,productId:p?.id||'',price:p?.price??null})})});return{rows:out,unread}}
function renderBulkPreview(unread=[]){let b=batch();$('#bulkOrderPreview').innerHTML=`<div class="divider"></div><div class="row between"><strong>주문 ${bulkRows.length}건 확인</strong><span class="small">단가 미입력 가능</span></div>${unread.length?`<div class="banner">⚠️ 형식을 인식하지 못한 ${unread.length}줄은 빠졌어요. 원문을 확인해 주세요: ${esc(unread.join(' / '))}</div>`:''}<div class="stack">${bulkRows.map((r,i)=>`<div class="card" style="margin:4px 0;box-shadow:none"><div class="name">${esc(r.buyer)} · ${r.qty}개</div><div class="meta">원문: ${esc(r.label)}</div><div class="formfield" style="margin:9px 0"><label for="bulkProduct${i}">상품 연결</label><select id="bulkProduct${i}" data-bulk-product="${i}"><option value="">직접 입력 (재고 연동 안 됨)</option>${b.products.map(p=>`<option value="${esc(p.id)}" ${p.id===r.productId?'selected':''}>${esc(labelProduct(p))}</option>`).join('')}</select></div><div class="formfield" style="margin:0"><label for="bulkPrice${i}">판매 단가(원)</label><input type="number" min="0" placeholder="나중에 입력" value="${r.price??''}" id="bulkPrice${i}" data-bulk-price="${i}"></div></div>`).join('')}</div><div class="hint">가격은 비워두고 등록할 수 있어요. 상품표에 없는 주문은 직접 입력으로 저장되며 수량 비교에는 연결되지 않아요.</div><button class="btn full" id="bulkCommit" ${!bulkRows.length?'disabled':''}>${bulkRows.length}건 주문 등록</button>`;$('#bulkCommit').onclick=()=>{let b=batch();bulkRows.forEach(r=>b.orders.push({id:uid(),buyer:r.buyer.trim(),productId:r.productId,customName:r.productId?'':r.label,qty:r.qty,price:r.price,delayed:!!catalog(b,r.productId)?.delayed,soldOut:false}));closeModal();changeView('orders');saveRender();toast(bulkRows.length+'건을 등록했어요')};}
function copyText(text){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(()=>toast('복사했어요! 카톡에 붙여넣으세요')).catch(()=>fallbackCopy(text))}else fallbackCopy(text)}
function fallbackCopy(text){let t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.left='-1000px';document.body.appendChild(t);t.select();try{if(document.execCommand('copy'))toast('복사했어요!');else alert('복사가 제한돼요. 내용을 선택해서 복사해 주세요.')}catch(e){alert('복사가 제한돼요. HTTPS 웹주소로 사용하면 복사 기능을 이용할 수 있어요.')}t.remove()}
function billText(b,n){const rows=b.orders.filter(o=>o.buyer===n),soldoutValue=rows.filter(o=>o.soldOut).reduce((s,o)=>s+money(o.price)*money(o.qty),0),unknown=unpriced(b,n).length;return `[${b.name}] ${n}님 주문 내역\n`+rows.map(o=>`• ${lineLabel(b,o)} ${o.qty}개 × ${priceText(o.price)} = ${o.soldOut?'청구 제외 (품절)':priced(o)?won(money(o.price)*money(o.qty)):'금액 미정'}${!o.soldOut&&delayedLine(b,o)?' (※ 미송)':''}`).join('\n')+`\n${unknown?'현재 확인된':'상품'} 합계 (품절 제외): ${won(orderSub(b,n))}${unknown?`\n⚠️ 가격 미입력 ${unknown}건 · 총액 미확정`:''}${soldoutValue?`\n품절 제외액: ${won(soldoutValue)}`:''}\n입금액: ${won(paid(b,n))}\n환불 완료: ${won(refunded(b,n))}${unknown?'':`\n남은 미입금액: ${won(pending(b,n))}\n환불 필요액: ${won(refundNeeded(b,n))}`}`}
function downloadFile(name,body,type){const blob=new Blob([body],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}
function downloadBackup(){downloadFile('공구노트-전체백업-'+today()+'.json',JSON.stringify(data,null,2),'application/json;charset=utf-8');toast('백업 파일을 저장해 주세요')}
function downloadCsv(){let b=batch(),rows=[['공구','주문자','상품','주문수량','단가(미입력은 공백)','원주문금액','품절 여부','실제 청구금액','미송','청구총액(주문자별,미확정 가능)','가격 미입력 건수','입금합계','환불 완료','환불 필요','미입금 잔액','입금상태']];for(let o of b.orders){rows.push([b.name,o.buyer,lineLabel(b,o),o.qty,priced(o)?o.price:'',priced(o)?o.qty*o.price:'',o.soldOut?'품절':'',o.soldOut?0:priced(o)?o.qty*o.price:'',!o.soldOut&&delayedLine(b,o)?'미송':'',owed(b,o.buyer),unpriced(b,o.buyer).length,paid(b,o.buyer),refunded(b,o.buyer),refundNeeded(b,o.buyer),pending(b,o.buyer),paidStatus(b,o.buyer)])}let csv='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');downloadFile('공구노트-주문표-'+today()+'.csv',csv,'text/csv;charset=utf-8');toast('주문표를 내보냈어요')}
function onAction(action,btn){let b=batch(),id=btn?.dataset.id,n=btn?.dataset.buyer;switch(action){case'order-add':multiOrderModal(n||'');break;case'multi-row-add':$('#multiRows').insertAdjacentHTML('beforeend',multiRowTemplate(b));break;case'multi-row-remove':if($('#multiRows').children.length>1){btn.closest('.multi-line').remove()}else toast('최소 1개 상품은 필요해요');break;case'order-bulk':bulkOrderModal();break;case'product-add':productModal();break;case'product-bulk':productBulkModal();break;case'order-edit':orderModal(id);break;case'product-edit':productModal(id);break;case'payment-edit':paymentModal(n);break;case'modal-close':closeModal();break;case'buyer-toggle':openBuyers[n]=openBuyers[n]===false?true:false;render();break;case'bill-copy':copyText(billText(b,n));break;case'batch-edit':batchModal('edit');break;case'batch-add':batchModal('add');break;case'mark-refund':{const amount=refundNeeded(b,n);if(!amount)return; if(!confirm(`${n}님께 ${won(amount)}을 실제로 환불했나요? 환불 기록만 저장하며 송금하지 않아요.`))return;b.refunds=b.refunds||{};b.refunds[n]=refunded(b,n)+amount;closeModal();saveRender();toast('환불 완료로 기록했어요');break;}case'mark-full':if(unpriced(b,n).length){toast('가격 미입력 상품부터 확인해 주세요');return}if(refundNeeded(b,n)){toast('환불할 금액을 먼저 처리하세요');return}b.payments[n]=owed(b,n)+refunded(b,n);closeModal();saveRender();toast(n+' 입금 완료');break;case'backup':downloadBackup();break;case'csv':downloadCsv();break;case'restore':$('#restoreFile')?.click()||openRestore();break;case'batch-archive':b.archived=!b.archived;saveRender();toast(b.archived?'정산 완료로 표시했어요':'완료 표시를 해제했어요');break;case'batch-delete':if(!confirm(`'${b.name}' 공구를 삭제할까요? 이 작업은 되돌릴 수 없어요.`))return;data.batches=data.batches.filter(x=>x.id!==b.id);if(!data.batches.length){let x=initial();data.batches=x.batches}data.activeId=data.batches[0].id;view='home';saveRender();break;case'order-delete':if(!confirm('이 주문을 삭제할까요?'))return;{let found=b.orders.find(x=>x.id===id);b.orders=b.orders.filter(x=>x.id!==id);if(found&&!b.orders.some(o=>o.buyer===found.buyer)){delete b.payments[found.buyer];if(b.refunds)delete b.refunds[found.buyer]}closeModal();saveRender();toast('주문 삭제 완료')}break;case'product-delete':if(!confirm('이 상품을 삭제할까요? 기존 주문은 직접 입력 상품으로 유지됩니다.'))return;{let p=catalog(b,id);if(!p)return;b.orders.filter(o=>o.productId===id).forEach(o=>{o.productId='';o.customName=labelProduct(p);o.delayed=!!p.delayed});b.products=b.products.filter(x=>x.id!==id);closeModal();saveRender()}break;default:break;}}
function openRestore(){modal('백업 복원',`<p class="small">기존 데이터 전체를 백업 파일로 교체합니다. 먼저 현재 내용을 백업해 주세요.</p><div class="formfield"><label>백업 JSON 파일 선택</label><input id="restoreModalFile" type="file" accept=".json,application/json"></div><button class="btn full" id="restoreModalBtn">복원하기</button>`)}
async function handleRestore(file){if(!file)return;let json;try{json=JSON.parse(await file.text())}catch(e){alert('JSON 백업 파일을 읽을 수 없어요.');return}if(!validState(json)){alert('공구노트에서 만든 올바른 백업 파일이 아니에요.');return}if(!confirm('현재 기록을 백업 내용으로 교체할까요? 기존 기록은 삭제됩니다.'))return;data=json;if(!data.batches.some(b=>b.id===data.activeId))data.activeId=data.batches[0].id;closeModal();saveRender();toast('백업을 복원했어요')}
function onSubmit(form){let b=batch(),fid=form.id;const val=id=>($(`[id="${id}"]`)?.value||'').trim();if(fid==='productForm'){let name=val('pname'),p=idVal(form.dataset.id),price=optionalPrice(val('pprice')),qty=val('psupplier')===''?null:money(val('psupplier'));if(!name){alert('상품명을 입력해 주세요');return}const x={name,color:val('pcolor'),size:val('psize'),price,supplierQty:qty,delayed:$('#pdelayed').checked};const dupe=b.products.find(o=>o.id!==p?.id&&normalize(labelProduct(o))===normalize(labelProduct(x)));if(dupe){alert('같은 상품·색상·사이즈가 이미 등록되어 있어요');return}if(p){const oldDelay=!!p.delayed;Object.assign(p,x);for(const o of b.orders.filter(o=>o.productId===p.id)){if(oldDelay!==x.delayed)o.delayed=x.delayed;if(!priced(o)&&price!==null)o.price=price}linkCatalogOrders(b,p)}else{const item={...x,id:uid()};b.products.push(item);linkCatalogOrders(b,item)}closeModal();saveRender();toast('상품을 저장했어요')}
else if(fid==='orderForm'){let buyer=val('obuyer'),pid=val('oproduct'),p=catalog(b,pid),custom=val('ocustom'),qty=money(val('oqty')),price=optionalPrice(val('oprice'));if(!buyer||(!p&&!custom)||qty<1){alert('주문자, 상품, 수량을 확인해 주세요');return}let o=idVal(form.dataset.id);let prevBuyer=o?.buyer;let x={buyer,productId:pid,customName:p?'':custom,qty,price,delayed:$('#odelayed').checked,soldOut:$('#osoldout').checked};if(o)Object.assign(o,x);else b.orders.push({...x,id:uid()});if(prevBuyer&&prevBuyer!==buyer&&!b.orders.some(z=>z.buyer===prevBuyer)){delete b.payments[prevBuyer];if(b.refunds)delete b.refunds[prevBuyer]}closeModal();saveRender();toast('주문을 저장했어요')}
else if(fid==='multiOrderForm'){const buyer=val('multiBuyer'),els=[...form.querySelectorAll('.multi-line')];if(!buyer){alert('주문자 이름을 입력해 주세요');return}const entries=els.map(node=>{let productId=node.querySelector('.multi-product').value,p=catalog(b,productId);return{buyer,productId,customName:p?'':node.querySelector('.multi-name').value.trim(),qty:money(node.querySelector('.multi-qty').value),price:optionalPrice(node.querySelector('.multi-price').value),delayed:!!p?.delayed,soldOut:false}});if(entries.some(e=>!e.productId&&!e.customName||e.qty<1)){alert('상품명과 수량을 확인해 주세요');return}entries.forEach(e=>b.orders.push({id:uid(),...e}));openBuyers[buyer]=true;closeModal();view='orders';saveRender();toast(buyer+' 주문 '+entries.length+'건 저장했어요')}
else if(fid==='paymentForm'){let buyer=form.dataset.buyer;if(!buyer)return;const got=money(val('paidvalue')),back=money(val('refundvalue'));if(back>got){alert('환불 금액이 입금액보다 많을 수 없어요.');return}b.payments[buyer]=got;b.refunds=b.refunds||{};b.refunds[buyer]=back;closeModal();saveRender();toast(buyer+' 입금·환불 기록을 저장했어요')}
else if(fid==='batchForm'){let name=val('batchname');if(!name){alert('공구 이름을 입력해 주세요');return}if(form.dataset.kind==='add'){let x={id:uid(),name,created:today(),archived:false,products:[],orders:[],payments:{},refunds:{}};data.batches.unshift(x);data.activeId=x.id;view='home'}else{b.name=name}closeModal();saveRender();toast('공구 설정을 저장했어요')}
else if(fid==='productBulkForm'){let rows=parseProductLines(val('productText'));if(!rows.length){alert('붙여넣을 상품이 없어요');return}productBulkPreview(rows)}
else if(fid==='bulkOrderForm'){let parsed=parseOrderLines(val('bulkOrderText'));bulkRows=parsed.rows;renderBulkPreview(parsed.unread)}}
function idVal(id){return id?batch().orders.find(x=>x.id===id)||batch().products.find(x=>x.id===id):null}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-view]');if(nav){changeView(nav.dataset.view);return}const a=e.target.closest('[data-action]');if(a){e.preventDefault();onAction(a.dataset.action,a)}});
document.addEventListener('submit',e=>{if(e.target.matches('#productForm,#orderForm,#paymentForm,#batchForm,#productBulkForm,#bulkOrderForm,#multiOrderForm')){e.preventDefault();onSubmit(e.target)}});
document.addEventListener('change',e=>{if(e.target.matches('[data-delay-toggle]')){let o=batch().orders.find(o=>o.id===e.target.dataset.id);if(!o)return;o.delayed=e.target.checked;const y=window.scrollY;saveRender();window.scrollTo(0,y);toast(o.delayed?'거래처 미송으로 표시했어요':'미송을 해제했어요');return}if(e.target.matches('.multi-product')){const line=e.target.closest('.multi-line'),p=catalog(batch(),e.target.value);if(p){line.querySelector('.multi-name').value=labelProduct(p);line.querySelector('.multi-price').value=p.price??''}return}if(e.target.matches('[data-stockout-toggle]')){let o=batch().orders.find(o=>o.id===e.target.dataset.id);if(!o)return;o.soldOut=e.target.checked;const y=window.scrollY;saveRender();window.scrollTo(0,y);toast(o.soldOut?'품절 처리했어요. 청구금액에서 제외돼요':'품절을 해제했어요');return}if(e.target.id==='batchPick'){data.activeId=e.target.value;view='home';saveRender()}if(e.target.id==='restoreFile'||e.target.id==='restoreModalFile'){handleRestore(e.target.files?.[0])}if(e.target.matches('[data-bulk-product]')){let i=Number(e.target.dataset.bulkProduct),p=catalog(batch(),e.target.value);bulkRows[i].productId=p?.id||'';if(p){bulkRows[i].price=p.price??null;const price=$(`#bulkPrice${i}`);if(price)price.value=p.price??''}}if(e.target.matches('[data-bulk-price]'))bulkRows[Number(e.target.dataset.bulkPrice)].price=optionalPrice(e.target.value)});
document.addEventListener('input',e=>{if(e.target.id==='orderSearch'){orderSearch=e.target.value;const caret=e.target.selectionStart;const y=window.scrollY;render();$('#orderSearch').focus();$('#orderSearch').setSelectionRange(caret,caret);window.scrollTo(0,y)}if(e.target.id==='productSearch'){productSearch=e.target.value;const caret=e.target.selectionStart;const y=window.scrollY;render();$('#productSearch').focus();$('#productSearch').setSelectionRange(caret,caret);window.scrollTo(0,y)}if(e.target.matches('[data-bulk-price]'))bulkRows[Number(e.target.dataset.bulkPrice)].price=optionalPrice(e.target.value)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
$('#modalMount').addEventListener('click',e=>{if(e.target.classList.contains('modalouter'))closeModal()});
if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
render();
</script>
</body>

/* v10 · iPhone 관리자 화면 최적화
   iOS Safari는 16px 미만 입력칸에 초점을 맞출 때 자동 확대될 수 있어
   숫자/선택 입력을 16px 이상으로 고정합니다. */
@media (max-width: 700px) {
  input, select, textarea {font-size:16px !important;}
  input[type=number], input[type=text], input[type=tel], input[type=email], textarea {max-width:100%; min-width:0;}
  .shell, .content, .card {min-width:0;}
  .tabs {max-width:100%; overscroll-behavior-x:contain; -webkit-overflow-scrolling:touch;}
  .card, .info, .noticefail, .smallnote {overflow-wrap:anywhere;}
}
@media (max-width: 519px) {
  .content {padding:16px 12px;}
  .card {padding:14px;}
  .sectiontitle {flex-wrap:wrap; align-items:flex-start;}
  .ordercard .row.between {flex-wrap:wrap; gap:8px;}
  .ordercard .row.between > * {min-width:0;}
  .ordercard .orderitem > .row.between {align-items:flex-start;}
  .ordercard .orderitem > .row.between > .grow {flex:1 1 100%; overflow-wrap:anywhere;}
  .ordercard .orderitem > .row.between > .money {margin-left:auto;}
  .ordercard .orderitem > .row.wrap {display:grid; grid-template-columns:minmax(0,1fr); gap:8px;}
  .ordercard .controlinline {display:grid; grid-template-columns:minmax(0,1fr) auto; width:100%; gap:8px;}
  .ordercard .controlinline input {width:100%; max-width:none; min-width:0; min-height:44px;}
  .ordercard .controlinline .btn {min-height:44px;}
  .ordercard .statusselect {width:100%; max-width:none; min-height:44px;}
  .ordercard .shipping-form {display:grid; grid-template-columns:minmax(0,1fr); gap:7px; align-items:stretch; margin-top:16px;}
  .ordercard .shipping-form > label {width:100%; min-width:0; flex:none !important; margin:0;}
  .ordercard .shipping-form .btn {width:100%; min-height:44px;}
  .ordercard .shipping-form input {width:100%; margin-top:5px;}
  .ordercard form.two {grid-template-columns:minmax(0,1fr); gap:9px;}
  .ordercard form.two > button {grid-column:1 !important; min-height:44px; width:100%;}
  .ordercard .row.wrap > button.btn {flex:1 1 calc(50% - 9px); white-space:normal; min-width:0;}
  .ordercard .row.wrap > button.btn.danger {flex:1 1 100%;}
  .ordercard .sumline {align-items:flex-start;}
  .ordercard .sumline > :first-child {min-width:0; overflow-wrap:anywhere;}
  .ordercard .sumline > :last-child {text-align:right; min-width:0; overflow-wrap:anywhere;}
  .tile {min-width:0; padding:10px;}
  .tile strong {overflow-wrap:anywhere; font-size:clamp(14px,3.8vw,19px);}
  .ordercard h3 {overflow-wrap:anywhere;}
}
@media (max-width: 349px) {
  .three {gap:5px;}
  .tile {padding:8px;}
  .ordercard .controlinline {grid-template-columns:minmax(0,1fr);}
  .ordercard .controlinline .btn {width:100%;}
  .ordercard .row.wrap > button.btn {flex:1 1 100%;}
}

.workflow-ship .label{min-width:0;display:block}
.workflow-ship input{width:100%;min-width:0;max-width:100%;font-size:16px}
.workflow-ship .btn{width:100%}

/* v19: 쇼핑 상품목록은 가게 구분 없이 한 줄에 두 상품씩 */
.shoplist .shop-catalog-count{margin:14px 0 9px;color:#66637b;font-size:12px;font-weight:720}
.shoplist .shop-catalog-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;align-items:stretch}
.shoplist .shop-catalog-card{display:flex;flex-direction:column;min-width:0;gap:6px;padding:10px;border:1px solid #e7e5f0;border-radius:17px;background:#fff;box-shadow:0 1px 8px rgba(32,27,74,.025)}
.shoplist .shop-catalog-photo{width:100%;aspect-ratio:1/1;border-radius:11px;overflow:hidden;background:#f5f3fb}
.shoplist .shop-catalog-photo .product-cover,.shoplist .shop-catalog-photo .producticon{width:100%;height:100%;aspect-ratio:1/1;border-radius:0;object-fit:cover;margin:0}
.shoplist .shop-catalog-photo .producticon{display:grid;place-content:center;font-size:27px}
.shoplist .shop-catalog-store{font-size:11px;line-height:1.35;color:#827d97;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shoplist .shop-catalog-card .producttitle{min-height:0;font-size:14px;line-height:1.4;font-weight:800;overflow-wrap:anywhere;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.shoplist .shop-catalog-colors{font-size:11px;line-height:1.4;color:#8a879a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shoplist .shop-catalog-select{min-height:37px;border-radius:10px;padding:8px 5px;font-size:12px}
@media(max-width:350px){.shoplist .shop-catalog-grid{gap:8px}.shoplist .shop-catalog-card{padding:8px}.shoplist .shop-catalog-card .producttitle{font-size:13px}}
@media(min-width:720px){.shoplist .shop-catalog-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}}
@media(min-width:1050px){.shoplist .shop-catalog-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}

/* v20 묶음배송 관리자 화면: 배송은 한 묶음 카드에, 정산 원장은 펼쳤을 때만 */
.bundle-summary-card{margin-bottom:14px;border:1px solid #cfc9fb;background:#fff;padding:18px 15px;min-width:0}
.bundle-summary-card h3{margin:0 0 5px;font-size:17px}
.bundle-title-tag{display:inline-flex;white-space:nowrap;background:#efeaff;color:#6153c2;font-size:12px;font-weight:830;padding:7px 9px;border-radius:999px}
.bundle-info{margin:12px 0;border-radius:13px;background:#f5f3fd;padding:12px;color:#49426d;font-size:13px;line-height:1.65;overflow-wrap:anywhere}
.bundle-items{border-top:1px solid #eae7f2;border-bottom:1px solid #eae7f2;margin:12px 0}
.bundle-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid #efedf5;min-width:0}
.bundle-item:last-child{border-bottom:0}
.bundle-item-main{flex:1;min-width:0;overflow-wrap:anywhere;font-size:13px}
.bundle-item-side{width:120px;flex:0 0 120px;text-align:right;display:flex;align-items:flex-end;flex-direction:column;gap:8px;font-size:13px}
.bundle-item-side select{width:100%;max-width:100%;font-size:12px;min-height:39px}
.bundle-flow{border:1px solid #e2dcfc;background:#f9f8ff;border-radius:14px;padding:12px;margin:13px 0}
.bundle-flow .btn{width:100%;margin-top:10px}
.bundle-flow .workflow-ship{margin-top:10px}
.bundle-children{border-top:1px solid #e8e4f2;margin-top:14px}
.bundle-children>summary{padding:15px 0 3px;cursor:pointer;list-style:none;color:#5a50bd;font-size:13px;font-weight:800}
.bundle-children>summary::-webkit-details-marker{display:none}
.bundle-children>summary::before{content:'▸';margin-right:8px}
.bundle-children[open]>summary::before{content:'▾'}
.bundle-expand-note{color:#9890b3;font-size:11px}
.bundle-children-inner{padding-top:14px}
.bundle-children-inner .ordercard{box-shadow:none;border:1px solid #e9e4f7;background:#fcfbff;padding:13px}
@media(max-width:380px){.bundle-item-side{width:107px;flex-basis:107px}.bundle-summary-card{padding:15px 12px}}


/* v21: 수령방식에 따라 품목 상태를 단순화 */
.bundle-item-side .workflow-stage,.orderitem .workflow-stage{max-width:100%;white-space:normal;word-break:keep-all;text-align:center}
@media(max-width:420px){.bundle-item-side .statusselect{font-size:13px;max-width:100%}}

/* v22 롯데택배 자동조회 — 상태 안내 표시 */
.lotte-tip{grid-column:1/-1;font-size:12px;line-height:1.55;color:#5f597c;background:#f3f1ff;padding:10px 12px;border-radius:10px}
.lotte-auto-chip{color:#6256d9;white-space:normal;text-align:right;margin-top:4px}
@media(max-width:600px){.lotte-tip{font-size:12px}}

/* v23: 묶음 배송은 한 장의 주문 카드만. 개별 원장은 카드 재출력 없이 압축 표시 */
.bundle-summary-card .bundle-children-inner{padding-top:8px;display:grid;gap:0}
.bundle-ledger-row{padding:13px 0;border-bottom:1px solid #e8e5f0;min-width:0}
.bundle-ledger-row:last-child{border-bottom:0}
.bundle-ledger-head{margin-bottom:4px}
.bundle-ledger-head>b{font-size:13px;color:#413881}
.bundle-ledger-edit{margin-top:6px}
.bundle-ledger-edit>summary,.bundle-ledger-work>summary,.bundle-delete>summary{cursor:pointer;font-weight:750;font-size:12px;color:#6657bd;padding:9px 0;list-style:revert;overflow-wrap:anywhere}
.bundle-ledger-edit-inner{background:#faf9fe;border:1px solid #ebe7f8;border-radius:13px;padding:11px;display:grid;gap:12px;min-width:0}
.bundle-price-item{padding-bottom:11px;border-bottom:1px solid #e8e4f3;min-width:0}
.bundle-price-item:last-child{border-bottom:0}
.bundle-price-item .controlinline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-top:6px;min-width:0;align-items:center}
.bundle-price-item .controlinline input{width:100%;min-width:0}
.bundle-ledger-row .shipping-form{display:grid;gap:6px}
.bundle-ledger-row .shipping-form .btn{width:100%}
.bundle-ledger-work .workflow-box{margin:8px 0 0}
.bundle-delete{margin-top:6px;border-top:1px solid #e6e3f0}
.bundle-delete summary{color:#9a6272}
.bundle-delete button{margin-top:3px}
@media(max-width:375px){.bundle-ledger-row .controlinline{grid-template-columns:minmax(0,1fr)}.bundle-price-item .controlinline .btn{width:100%}}


/* v24: 묶음배송의 송장 및 진행단계는 카드 상단 한곳에서 관리 */
.bundle-flow .btn{margin-top:9px;width:100%}
.bundle-items .bundle-item-side:empty{display:none}
.bundle-flow .workflow-stage{max-width:100%;white-space:normal;text-align:right}
.shipment-progress{margin:10px 0;padding:12px;border:1px solid #e2dcfc;border-radius:12px;background:#faf9ff;overflow-wrap:anywhere}
.shipment-progress a{color:#5141af;text-decoration:underline}
.shipment-history summary{cursor:pointer;padding:11px 0;font-size:13px;font-weight:750;color:#4d438e}
.shipment-timeline{list-style:none;margin:10px 0 0 8px;padding:0 0 0 15px;border-left:2px solid #dcd5fb}
.shipment-timeline-item{position:relative;margin:0;padding:0 0 18px 14px;min-width:0;overflow-wrap:break-word;word-break:normal}
.shipment-timeline-item:last-child{padding-bottom:2px}
.shipment-timeline-item::before{content:"";position:absolute;top:5px;left:-21px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid #9c8dec}
.shipment-timeline-item:first-child::before{background:#7461dd;border-color:#7461dd}
.shipment-timeline-head{display:flex;align-items:baseline;justify-content:space-between;gap:4px 12px;flex-wrap:wrap;line-height:1.5}
.shipment-timeline-head strong{font-size:13px;color:#3c326a;font-weight:800;min-width:0}
.shipment-timeline-head time{font-size:11px;color:#79718f;white-space:nowrap;font-variant-numeric:tabular-nums}
.shipment-timeline-location{font-size:12px;font-weight:650;color:#62568d;margin-top:4px}
.shipment-timeline-detail{font-size:12px;line-height:1.65;color:#666176;margin-top:3px}
@media(max-width:380px){.shipment-progress{padding:10px}.shipment-timeline{margin-left:4px;padding-left:12px}.shipment-timeline-item{padding-left:12px}.shipment-timeline-item::before{left:-18px}}

/* 2026 storefront refresh: neutral, all-gender mini boutique. Visual layer only. */
:root{--purple:#79614d;--purpdark:#554332;--soft:#f1ebe4;--bg:#faf8f5;--ink:#302c29;--gray:#817a73;--line:#ebe5dd;--green:#3e7765;--danger:#ac5362;--warn:#986d3d;--card:#fff}

.shop-benefits{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin:12px 0 24px;border-block:1px solid #e9e1d6;padding:12px 0}

.shop-actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:13px}
.shop-actions button{border:1px solid #ded1c2;border-radius:999px;background:#fffdf9;color:#6c5641;padding:7px 11px;font-size:11px;font-weight:760;min-height:33px}
.shop-search-wrap{position:relative}

#search{padding:12px 13px 12px 40px;background:#fffdfa;border-color:#e6dfd6;border-radius:12px;font-size:16px}
.shoplist .shop-catalog-count{margin:18px 0 10px;color:#827365;font-weight:650;font-size:11px}
.shoplist .shop-catalog-grid{gap:17px 11px}

.shop-catalog-quote{font-size:11px;color:#655345;font-weight:750;margin-top:4px}
.shoplist .shop-catalog-select{background:#fffdf9;color:#705a46;border:1px solid #dfd3c4;border-radius:9px;font-size:11px;min-height:35px;margin-top:5px}

/* MINIYENA / high-fashion storefront, black + white + cool neutrals.

 --purple:#111111;--purpdark:#000;--soft:#f2f2f2;--bg:#fff;

.shop-section-head{margin-bottom:20px;align-items:end}
.shop-section-head h2{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:27px;color:#111;letter-spacing:-.06em;font-weight:850;line-height:1.25}

.shop-editorial-label{display:inline-flex;align-items:center;width:max-content;max-width:100%;padding:7px 10px;border:1px solid #ffffffa8;color:#fff;font-size:10px;font-weight:850;letter-spacing:-.015em;background:#0005}

/* Five-item monochrome shopping dock; central shortcut uses the existing request dialog. */
.shop-bottom-nav{

 padding:3px 0;

}

/* Compact cart review first; checkout form stays safely collapsed until requested. */

.cart-review-intro b{color:#222}
.cart-review-toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:7px 1px 12px;border-bottom:1px solid #e5e5e5}

.cart-review-clear{appearance:none;border:1px solid #dedede;background:white;color:#555;font-size:12px;padding:9px 12px;border-radius:8px;cursor:pointer}

.cart-review-quantity{font-size:12px;color:#555}

.cart-review-remove:active{background:#fce8eb}
.cart-review-unavailable{font-size:11px;margin:10px 0 0;padding:9px}
.cart-review-undo{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 12px;margin:12px 0;background:#f4f4f4;border:1px solid #ddd;border-radius:9px;font-size:11px}
.cart-review-undo span{flex:1;min-width:0;line-height:1.6}

.bulk-option-builder{background:#fafafa;border:1px solid #ddd;border-radius:10px;padding:14px;margin:14px 0}

 /* A plain-text editor keeps iOS Safari's contact AutoFill toolbar off these option fields. */
 .bulk-option-builder .bulk-option-textbox{display:block;box-sizing:border-box;width:100%;min-width:0;min-height:150px;margin-top:6px;padding:12px;border:1px solid #d3d3d3;border-radius:4px;background:#fff;color:#111;font:inherit;font-size:16px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere;overflow-y:auto;-webkit-user-select:text;user-select:text;outline:none}
 .bulk-option-builder .bulk-option-textbox[data-bulk-editor="sizes"]{min-height:110px}

 .bulk-option-builder .bulk-option-textbox:empty:before{content:attr(data-placeholder);color:#aaa;white-space:pre-line;pointer-events:none}.bulk-option-enter-hint{font-size:11px;color:#777;font-weight:500;margin-left:5px}
.bulk-option-apply{background:#111!important;color:white!important;margin:12px 0 9px;padding:13px 8px!important;font-size:13px!important}

/* Non-destructive selection for product applications. Source images stay private. */
.approval-image-section{margin:12px 0;padding:11px;border:1px solid #e1e1e1;border-radius:11px;background:#fafafa}

.admin-upload-photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:10px 0}

/* ONE combined photo grid for customer submissions, admin additions, and product edits. */
.admin-combined-photo-editor{border:1px solid #dedede;background:#fbfbfb;border-radius:12px;padding:13px;margin:14px 0 18px}
.admin-combined-photo-heading>b{font-size:14px;color:#121212}

.admin-combined-photo-image img{display:block;width:100%;height:100%;object-fit:cover}
.admin-combined-photo-x{position:absolute;right:4px;top:4px;z-index:1;width:29px;height:29px;min-width:29px;min-height:29px;border:1px solid #fff9;border-radius:6px;color:#fff;background:#111d;font-size:24px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.admin-combined-photo-x:active{background:#bb2944}

.admin-combined-photo figcaption span{font-size:10px;color:#777;line-height:1.3}

.admin-combined-move button:disabled{color:#c5c5c5;background:#f5f5f5;cursor:default}
.admin-combined-photo-empty{text-align:center;color:#777;font-size:12px;padding:25px 5px}

/* iPhone-friendly pointer drag, with visible drop target and the original X overlay. */
.admin-combined-photo{position:relative;user-select:none;-webkit-user-select:none;transition:border-color .12s,box-shadow .12s}
.admin-combined-photo-image{touch-action:none;cursor:grab;-webkit-touch-callout:none}
.admin-combined-photo-image img{pointer-events:none;user-select:none;-webkit-user-select:none;-webkit-user-drag:none}
.admin-combined-photo-image:active{cursor:grabbing}
.admin-photo-drag-grip{position:absolute;left:4px;bottom:4px;width:25px;height:25px;display:flex;align-items:center;justify-content:center;background:#111b;color:#fff;border-radius:6px;font-size:19px;pointer-events:none}
.admin-combined-photo.is-photo-dragging{opacity:.92;border-color:#111;box-shadow:0 10px 24px #1114;transition:none;cursor:grabbing}
.admin-combined-photo.is-photo-drop-target{border:2px dashed #111;background:#efefef;box-shadow:0 0 0 2px #1112}
.admin-combined-photo:focus-visible{outline:2px solid #111;outline-offset:2px}

.shop-category-tab.active span,.admin-category-tab.active span{color:#dddddd}

.product-estimate-note{margin-top:7px;line-height:1.55;font-size:11px;color:#776d61}

async function api(path,{method='GET',body,admin=false,signal}={}){if(!connected)throw Error('온라인 연결 전 체험 모드입니다');const token=admin?await getToken():null;if(admin&&!token)throw Error('관리자 로그인이 필요해요');const h={apikey:key};if(token)h.Authorization='Bearer '+token;if(body!==undefined)h['Content-Type']='application/json';if(admin&&method!=='GET')h['Prefer']='return=representation';const r=await fetch(url+path,{method,headers:h,body:body===undefined?undefined:JSON.stringify(body),signal});const txt=await r.text();let j;try{j=txt?JSON.parse(txt):null}catch{j=txt};if(!r.ok){const error=Error(j?.message||j?.error_description||'서버 오류 '+r.status);error.code=j?.code;error.status=r.status;throw error}return j}
const rpc=(name,body,admin=false)=>api('/rest/v1/rpc/'+name,{method:'POST',body,admin});
// Existing v25 read RPCs: lookup failures never break existing orders.
const unavailableShippingRPCs=new Set();
async function optionalShippingRPC(name,body,admin=false){
 if(unavailableShippingRPCs.has(name))return null;
 try{return await api('/rest/v1/rpc/'+name,{method:'POST',body,admin,signal:AbortSignal.timeout(10000)})}
 catch(e){
  if(e.code==='PGRST202')unavailableShippingRPCs.add(name);
  else console.warn('배송 상세 조회를 완료하지 못했어요:',e.message);
  return null;
 }
}
function applyShippingDetails(q,snapshot){
 if(!q||q.status==='cancelled'||q.delivery_method!=='courier'||!isLotteShipment(q)||!snapshot)return;
 // The v25 result enriches only this invoice. It cannot overwrite any order field.
 if(!validShipmentSnapshot({...q,shipment_tracking:snapshot}))return;
 q.shipment_tracking=snapshot;
}
async function loadAdminShipping(){
 const quotes=state.quotes;
 if(!state.admin||!quotes.some(q=>q.status!=='cancelled'&&q.delivery_method==='courier'&&isLotteShipment(q)))return;
 const payload=await optionalShippingRPC('gq_lotte_tracking_admin_v25',{},true);
 if(!state.admin||state.quotes!==quotes)return;
 const byInvoice=indexV25AdminTracking(payload);
 for(const q of quotes)applyShippingDetails(q,byInvoice.get(normalizedInvoice(q.tracking_number)));
}

function supplierBulkSelectedInfo(){
 const selected=supplierBulkSelectedItems();
 const storeId=state.supplierBulkStoreId;
 const buyerKeys=[...new Set(selected.map(({q})=>String(q.contact||'').replace(/\D/g,'')))].sort();

  selected.some(({q,item})=>!supplierBulkAvailableItem(q,item)||
   supplierItemStore(item)!==storeId||

function supplierBulkExistingManualFees(selected){
 const payers=new Map();
 for(const {q} of selected){
  const key=String(q.contact||'').replace(/\D/g,'');
  if(!key||!payers.has(key)||q.id.localeCompare(payers.get(key).id)<0)
   payers.set(key,q);
 }
 const flagged=[];
 for(const q of payers.values()){
  const recorded=state.supplierBatches.reduce((sum,b)=>sum+
   (b.payers||[]).filter(p=>p.charged_quote_id===q.id)
    .reduce((n,p)=>n+Number(p.amount||0),0),0);
  const manual=Math.max(0,supplierShippingShare(q)-recorded);
  if(manual>0)flagged.push({q,manual});
 }
 return {flagged,buyers:flagged.length,total:flagged.reduce((sum,p)=>sum+p.manual,0)};
}

/* Weekly Mon/Thu customer cutoff 19:00 and wholesale order 21:00 Korea time.
   Schedule display only; admin still manually places all orders. */
const PROCUREMENT_DAYS=[1,4];
function nextProcurementEvent(nowMs,hour){
 const d=new Date(nowMs+9*3600000),y=d.getUTCFullYear(),m=d.getUTCMonth(),date=d.getUTCDate();
 for(let add=0;add<8;add++){
  const t=Date.UTC(y,m,date+add,hour-9,0,0);
  if(PROCUREMENT_DAYS.includes(new Date(t+9*3600000).getUTCDay())&&t>nowMs)return t;
 }
 throw Error('발주 일정을 계산할 수 없어요');
}
function scheduleEventText(ms){
 const d=new Date(ms+9*3600000),week=['일','월','화','수','목','금','토'];
 return (d.getUTCMonth()+1)+'월 '+d.getUTCDate()+'일('+week[d.getUTCDay()]+') 오후 '+(d.getUTCHours()===19?'7시':'9시');
}
function scheduleRemaining(ms,nowMs){
 const n=Math.max(0,Math.ceil((ms-nowMs)/60000));
 return [Math.floor(n/1440)?Math.floor(n/1440)+'일':'',Math.floor(n%1440/60)?Math.floor(n%1440/60)+'시간':'',n%60?(n%60)+'분':''].filter(Boolean).join(' ')||'곧';
}
function updateProcurementSchedule(){
 const now=Date.now(),cutoff=nextProcurementEvent(now,19),order=nextProcurementEvent(now,21);
 document.querySelectorAll('[data-next-cutoff]').forEach(el=>el.textContent=scheduleEventText(cutoff));
 document.querySelectorAll('[data-cutoff-countdown]').forEach(el=>el.textContent=scheduleRemaining(cutoff,now));
 document.querySelectorAll('[data-next-order]').forEach(el=>el.textContent=scheduleEventText(order));
 document.querySelectorAll('[data-order-countdown]').forEach(el=>el.textContent=scheduleRemaining(order,now));
}

ttledBuyerTotal(q)?'배송비 계산 후 확정':!readyQuote(q)?'배송비 산정 중':money(totalDue(q))}</b></div>${confirmedPaymentWidget(q)}${buyerWholesaleStatus(q)}${q.status==='requested'?'<div class="info">운영자가 상품 가격을 확인 중이에요. 견적을 받으면 먼저 구매 회차를 선택해 주세요. 배송비는 구매 의사 확인 후 계산해요.</div>':q.status==='quoted'?`${buyerRoundIntent(q)}`:q.status==='confirmed'?`<div class="info"><b>📦 주문 진행: ${workflowLabel(q)}</b>${trackingInfo(q)?`<div class="smallnote" style="margin-top:5px">택배사·운송장: ${esc(trackingInfo(q))}</div>${renderShipment(q)}${isLotteShipment(q)?'<div class="smallnote" style="margin-top:4px">롯데택배 배송조회 연결 · 배송 완료 확인 시 자동 반영 (조회 지연 가능)</div>':''}`:''}${q.delivery_method==='courier'&&!trackingInfo(q)?'<div class="smallnote">이 주문에 등록된 송장번호가 아직 없어요. 묶음배송이라면 운영자에게 송장 등록 상태를 확인해 주세요.</div>':''}${q.items.some(i=>i.fulfillment==='sold_out')?`<div class="smallnote" style="margin-top:5px">품절된 상품은 결제금액에서 제외되었어요. 실제 환불은 판매자에게 확인해 주세요.${allSoldOut(q)?' 전부 품절되어 배송비도 제외돼요.':''}</div>`:''}<div class="smallnote">수령 진행 상황은 이 링크에서 새로고침하여 확인할 수 있어요.</div></div><div class="tiny">입금 확인: ${money(q.amount_paid||0)} / 환불 완료: ${money(q.amount_refunded||0)}</div>`:'<div class="noticefail">취소된 견적입니다.</div>'}${q.amount_changed_at&&['quoted','confirmed'].includes(q.status)?`<div class="noticefail" style="margin:10px 0"><b>견적 금액이 수정되었어요</b><div>관리자가 상품 가격 또는 배송비를 변경했어요. 최신 결제금액을 확인하고, 이미 결제했다면 차액·환불 여부를 판매자에게 확인해 주세요.</div><div class="smallnote">변경 ${fmtDate(q.amount_changed_at)}</div></div>`:''}${q.cancel_requested_at&&q.status!=='cancelled'?`<div class="noticefail"><b>취소 요청 접수됨</b><div>관리자가 확인 후 취소 여부를 처리해요. 최종 주문은 잠시 진행하지 말아 주세요.</div>${q.cancel_reason?`<div class="tiny">요청 사유: ${esc(q.cancel_reason)}</div>`:''}</div>`:q.cancel_rejected_at&&q.status!=='cancelled'?'<div class="noticefail">관리자가 이전 취소 요청을 반려했어요. 여전히 취소가 필요하면 다시 요청할 수 있어요.</div>':''}

function requestPhotoPaths(r){

}

// The visible order, rather than separate submitted/new arrays, is the source

let adminPhotoSequence=[];
function clearAdminSelectedPhotos(){
 for(const entry of adminPhotoSequence){
  if(entry.kind==='new'&&entry.preview)URL.revokeObjectURL(entry.preview);
 }
 adminPhotoSequence=[];
}
function initAdminPhotoSequence(type,id){
 clearAdminSelectedPhotos();
 if(type==='approve'){
  const request=state.requests.find(x=>x.id===id);
  adminPhotoSequence=requestPhotoPaths(request).map(path=>({kind:'request',path}));
 }else if(type==='product'){
  const p=selectedProd(id);
  const urls=[p?.image_url,...(Array.isArray(p?.gallery_urls)?p.gallery_urls:[])].filter(x=>typeof x==='string'&&x);
  adminPhotoSequence=[...new Set(urls)].map(src=>({kind:'existing',src}));
 }
}
function adminPhotoPreview(entry){
 if(entry.kind==='request')
  return `<img data-request-photo="${esc(entry.path)}" alt="신청자가 업로드한 상품 사진" loading="lazy">`;
 if(entry.kind==='existing')
  return `<img src="${esc(entry.src)}" alt="등록된 상품 사진" loading="lazy">`;
 return `<img src="${entry.preview}" alt="관리자가 새로 추가한 상품 사진" loading="lazy">`;
}

let adminPhotoDrag=null;
function cancelAdminPhotoDrag(){
 const d=adminPhotoDrag;
 if(!d)return;
 adminPhotoDrag=null;
 d.card.classList.remove('is-photo-dragging');
 d.card.style.removeProperty('transform');
 d.card.style.removeProperty('z-index');
 d.grid.classList.remove('is-photo-reordering');
 d.grid.querySelectorAll('.is-photo-drop-target').forEach(x=>x.classList.remove('is-photo-drop-target'));
 try{if(d.zone.hasPointerCapture?.(d.id))d.zone.releasePointerCapture(d.id)}catch{}
}
function startAdminPhotoDrag(e){
 if(!state.admin||!['approve','product'].includes(state.modal?.type)||e.isPrimary===false||(e.pointerType==='mouse'&&e.button!==0))return;
 if(e.target.closest('button'))return; // the little × always deletes, never drags
 const zone=e.target.closest('[data-photo-drag-zone]');
 const card=zone?.closest('[data-admin-photo-index]');
 const grid=card?.closest('[data-admin-photo-list]');
 const form=grid?.closest('form');
 if(!zone||!card||!grid||!form||!['approve-form','product-form'].includes(form.id)||adminPhotoSequence.length<2)return;
 const index=Number(card.dataset.adminPhotoIndex);
 if(!Number.isInteger(index)||index<0||index>=adminPhotoSequence.length)return;
 cancelAdminPhotoDrag();
 adminPhotoDrag={id:e.pointerId,zone,card,grid,form,from:index,to:index,x:e.clientX,y:e.clientY,dragging:false,rect:null};
 try{zone.setPointerCapture?.(e.pointerId)}catch{}
 if(e.cancelable)e.preventDefault();
}
function targetAdminPhotoIndex(d,x,y){
 const box=d.grid.getBoundingClientRect();
 if(x<box.left-40||x>box.right+40||y<box.top-70||y>box.bottom+70)return d.from;
 let target=d.from,best=Infinity;
 d.grid.querySelectorAll('[data-admin-photo-index]').forEach(card=>{
  const rect=card===d.card?d.rect:card.getBoundingClientRect();
  const dx=x-(rect.left+rect.width/2),dy=y-(rect.top+rect.height/2),distance=dx*dx+dy*dy;
  if(distance<best){best=distance;target=Number(card.dataset.adminPhotoIndex);}
 });
 return target;
}
function moveAdminPhotoDrag(e){
 const d=adminPhotoDrag;
 if(!d||d.id!==e.pointerId)return;
 if(!d.card.isConnected||!d.grid.isConnected){cancelAdminPhotoDrag();return;}
 const dx=e.clientX-d.x,dy=e.clientY-d.y;
 if(!d.dragging){
  if(Math.hypot(dx,dy)<7)return;
  d.dragging=true;
  d.rect=d.card.getBoundingClientRect();
  d.card.classList.add('is-photo-dragging');
  d.grid.classList.add('is-photo-reordering');
 }
 if(e.cancelable)e.preventDefault();
 d.card.style.transform='translate3d('+dx+'px,'+dy+'px,0) scale(1.04)';
 d.card.style.zIndex='5';
 d.to=targetAdminPhotoIndex(d,e.clientX,e.clientY);
 d.grid.querySelectorAll('.is-photo-drop-target').forEach(x=>x.classList.remove('is-photo-drop-target'));
 const target=d.grid.querySelector('[data-admin-photo-index="'+d.to+'"]');
 if(target&&target!==d.card)target.classList.add('is-photo-drop-target');
 const scrollArea=d.grid.closest('.sheet-product-scroll')||d.grid.closest('.sheet');
 if(scrollArea){
  const box=scrollArea.getBoundingClientRect();
  if(e.clientY>box.bottom-54)scrollArea.scrollTop+=14;
  else if(e.clientY<box.top+54)scrollArea.scrollTop-=14;
 }
}
function endAdminPhotoDrag(e){
 const d=adminPhotoDrag;
 if(!d||d.id!==e.pointerId)return;
 const {from,to,form,dragging}=d;
 cancelAdminPhotoDrag();
 if(dragging){
  if(e.cancelable)e.preventDefault();
  moveAdminPhotoTo(from,to,form);
 }
}
function keyAdminPhotoMove(e){
 if(!state.admin||!['approve','product'].includes(state.modal?.type)||!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;
 if(e.target.matches('input,textarea,select,button'))return;
 const card=e.target.closest('[data-admin-photo-index]'),form=card?.closest('form');
 if(!card||!form||!['approve-form','product-form'].includes(form.id))return;

 if(moveAdminPhotoTo(from,target,form))form.querySelector('[data-admin-photo-index="'+target+'"]')?.focus();
}
function validateAdminPhotoSequence(type,id){
 if(!state.admin)throw Error('관리자만 사진을 편집할 수 있어요.');
 if(adminPhotoSequence.length<1)throw Error('등록할 사진을 한 장 이상 남겨 주세요.');
 if(adminPhotoSequence.length>9)throw Error('상품 사진은 대표사진 포함 최대 9장이에요.');
 const allowed=type==='approve'?requestPhotoPaths(state.requests.find(r=>r.id===id)):[];
 const oldProduct=type==='product'?selectedProd(id):null;
 const existing=new Set([oldProduct?.image_url,...(Array.isArray(oldProduct?.gallery_urls)?oldProduct.gallery_urls:[])].filter(Boolean));
 const used=new Set();
 for(const entry of adminPhotoSequence){
  if(entry.kind==='request'){
   if(type!=='approve'||!allowed.includes(entry.path)||used.has('request:'+entry.path))throw Error('신청 사진이 변경됐어요. 다시 열어 주세요.');
   used.add('request:'+entry.path);
  }else if(entry.kind==='existing'){
   if(type!=='product'||!existing.has(entry.src)||used.has('existing:'+entry.src))throw Error('상품 사진이 변경됐어요. 다시 열어 주세요.');
   used.add('existing:'+entry.src);
  }else if(entry.kind==='new'){
   if(!entry.file?.size||!entry.file.type?.startsWith('image/')||entry.file.size>35*1024*1024)throw Error('새 사진 파일을 다시 확인해 주세요.');
  }else throw Error('올바르지 않은 상품 사진 항목이에요.');
 }
 return [...adminPhotoSequence];
}
async function saveAdminPhotoSequence(items){
 const urls=[];
 for(const entry of items){
  if(entry.kind==='existing'){urls.push(entry.src);continue;}
  const file=entry.kind==='request'?await downloadPrivatePhoto(entry.path):entry.file;
  const path=await uploadPhoto(file,PHOTO_PUBLIC,true);
  urls.push(publicPhotoUrl(path));
 }
 return {image_url:urls[0],gallery_urls:urls.slice(1)};
}

// 묶음배송은 서버의 개별 주문/정산 정보를 보존하면서 관리자 화면에서만 한 주문 카드로 묶습니다.
function bundleRootId(q){
 if(q.status==='cancelled')return q.id;
 const seen=new Set([q.id]);let cur=q;
 for(let n=0;n<15 && cur.bundle_parent_id;n++){
  const p=state.quotes.find(x=>x.id===cur.bundle_parent_id);
  if(!p||p.status==='cancelled'||seen.has(p.id))break;
  seen.add(p.id);cur=p;
 }
 return cur.id;
}
function bundledQuoteGroups(visible){
 const byId=new Map();
 for(const q of state.quotes){
  const id=bundleRootId(q);
  if(!byId.has(id))byId.set(id,[]);
  byId.get(id).push(q);
 }
 const visibleIds=new Set(visible.map(q=>q.id));
 return Array.from(byId.values()).filter(group=>group.some(q=>visibleIds.has(q.id)))
  .map(group=>group.sort((a,b)=>a.id===bundleRootId(a)?-1:b.id===bundleRootId(b)?1:0))
  .sort((a,b)=>Math.max(...b.map(q=>Date.parse(q.created_at)||0))-Math.max(...a.map(q=>Date.parse(q.created_at)||0)));
}

   action=`<button class="btn" data-action="bundle-stage" data-id="${root.id}" data-stage="preparing">묶음 상품 준비 시작</button>`;
  }else if(method==='courier' && group.some(q=>saleItems(q).length>0)){
   action=`<form data-bundle-ship="${root.id}" class="workflow-ship"><label class="label">택배사<input name="carrier" required maxlength="60" value="롯데택배" placeholder="롯데택배"></label><label class="label">송장번호<input name="tracking" required maxlength="80" placeholder="송장번호를 입력하세요"></label><button type="submit" class="btn">묶음 송장 등록 · 배송 중</button></form>`;
  }else if(method==='pickup' && group.every(allReceived)){

// 품목 상태는 위의 한 목록에서 처리하고, 가격/입금 등 개별 회계 정보만 접어서 표시합니다.
// Admin-only price organization. Totals are product-only (shipping excluded).
// Missing estimates/prices are visibly marked as partial; never treated as zero.
function adminEstimatedUnitPrice(item){
 const p=state.products.find(x=>x.id===item.product_id);
 const estimate=Number(p?.estimated_price);
 if(Number.isInteger(estimate)&&estimate>0)return estimate;
 if(!state.productPrivateReady||!item.product_id)return null;
 const wholesale=Number(state.productPrivate[item.product_id]?.wholesale_price);
 return Number.isFinite(wholesale)&&wholesale>0?Math.round(wholesale*1.4/1000)*1000:null;
}
function adminPriceSummary(orders){
 const summary={estimate:0,actual:0,wholesale:0,missingEstimates:0,missingActual:0,missingWholesale:0,pricedCount:0,itemCount:0};
 for(const q of orders){
  if(q.status==='cancelled')continue;
  for(const item of q.items||[]){
   if(item.fulfillment==='sold_out')continue;
   const qty=Number(item.quantity)||0;
   summary.itemCount++;
   // 도매 단가는 관리자 전용 데이터에서만 읽으며, 상품 수량을 곱해 합산합니다.
   const privateCost=item.product_id&&state.productPrivateReady?state.productPrivate?.[item.product_id]:null;
   const rawWholesale=privateCost?.wholesale_price;
   const wholesale=rawWholesale===null||rawWholesale===undefined||rawWholesale===''?null:Number(rawWholesale);
   if(!state.productPrivateReady||wholesale===null||!Number.isFinite(wholesale)||wholesale<0)summary.missingWholesale++;
   else summary.wholesale+=wholesale*qty;
   const price=adminEstimatedUnitPrice(item);
   if(price==null)summary.missingEstimates++;
   else summary.estimate+=price*qty;
   if(item.unit_price==null)summary.missingActual++;
   else{summary.actual+=Number(item.unit_price)*qty;summary.pricedCount++;}
  }
 }
 return summary;
}

function renderBundleCard(group){

 const refunded=group.reduce((n,q)=>n+Number(q.amount_refunded||0),0);
 const due=group.reduce((n,q)=>n+totalDue(q),0);

 return `<div class="card bundle-summary-card"><div class="row between wrap"><div><h3>${esc(root.buyer_name)} <span class="chip purple">아기: ${esc(root.baby_name||'미입력')}</span></h3><div class="tiny">${esc(root.contact||'연락처 없음')} · ${group.length}건 묶음</div>${group.some(q=>q.supplier_ordered_at)?'<div class="workflow-stage" style="margin-top:7px">도매 발주 완료 · 상품 준비 중</div>':''}</div><span class="bundle-title-tag">📦 묶음배송</span></div>

 ${issue?'<div class="noticefail">변경 또는 취소 요청이 있어요. 아래 주문별 상세를 열어 확인해 주세요.</div>':''}

 ${adminPriceTotalMarkup(group,true)}
 <div class="sumline"><span>총 상품금액</span><strong>${group.some(unknown)?'일부 가격 미정':money(group.reduce((n,q)=>n+previewOrderSum(q),0))}</strong></div><div class="sumline"><span>고객 배송비 합계 (한 번)</span><strong>${money(group.reduce((n,q)=>n+appliedShipping(q),0))}</strong></div><div class="sumline"><span>도매 배송비 분담금 합계</span><strong>${money(group.reduce((n,q)=>n+supplierShippingShare(q),0))}</strong></div><div class="sumline total"><span>묶음 결제금액</span><strong>${costKnown?money(due):'견적 작성 중'}</strong></div>

function receivedDayKey(value){
 const date=new Date(value);
 if(!Number.isFinite(date.getTime()))return 'unknown';
 const pieces=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(date);
 const valueFor=part=>pieces.find(p=>p.type===part)?.value||'00';
 return valueFor('year')+'-'+valueFor('month')+'-'+valueFor('day');
}
function receivedDayLabel(day){
 if(day==='unknown')return '날짜 미확인';
 const date=new Date(day+'T12:00:00+09:00');
 return new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',year:'numeric',month:'long',day:'numeric',weekday:'short'}).format(date);
}
function groupedQuotesByDay(visible,suppliedGroups=null){
 const ids=new Set(visible.map(q=>q.id));
 const dayGroups=new Map();
 // Keep bundles together. A multi-date bundle belongs under its latest matching received date.
 for(const group of suppliedGroups||bundledQuoteGroups(visible)){
  const matching=group.filter(q=>ids.has(q.id));
  const received=(matching.length?matching:group).reduce((latest,q)=>!latest||(Date.parse(q.created_at)||0)>(Date.parse(latest.created_at)||0)?q:latest,null);
  const day=receivedDayKey(received?.created_at);
  if(!dayGroups.has(day))dayGroups.set(day,[]);
  dayGroups.get(day).push(group);
 }
 return [...dayGroups.entries()].sort((a,b)=>a[0]==='unknown'?1:b[0]==='unknown'?-1:b[0].localeCompare(a[0]));
}

// Customer-by-customer wholesale allocation, with a saved batch that can be
// marked supplier-ordered only after *every* included quote is confirmed+paid.
// Each wholesale supplier has an independent freight batch, even when
// multiple suppliers' items belong to the very same customer order.
function supplierBatchPaymentState(batch){
 const items=(batch.item_ids||[]).map(itemId=>
  state.quotes.flatMap(q=>(q.items||[]).map(item=>({q,item}))).find(x=>x.item.id===itemId)
 ).filter(Boolean);
 const result=(batch.payers||[]).map(payer=>{
  const selected=items.filter(x=>String(x.q.contact||'').replace(/\D/g,'')===payer.buyer_key);
  const rootIds=new Set(selected.map(x=>x.q.bundle_parent_id||x.q.id));
  const orders=state.quotes.filter(q=>q.status!=='cancelled'&&
   (rootIds.has(q.id)||rootIds.has(q.bundle_parent_id)));
  const due=orders.reduce((sum,q)=>sum+totalDue(q),0);
  const net=orders.reduce((sum,q)=>sum+Number(q.amount_paid||0)-Number(q.amount_refunded||0),0);
  const selectedReady=selected.length>0&&selected.every(({q,item})=>
   q.status==='confirmed'&&item.fulfillment!=='sold_out'&&
   !item.supplier_ordered_at&&!q.supplier_ordered_at&&
   !q.cancel_requested_at&&!q.delivery_change_requested_at&&
   ['new','preparing'].includes(workflowStage(q)));
  const allReady=orders.length>0&&orders.every(q=>
   q.status==='confirmed'&&readyQuote(q)&&!allSoldOut(q)&&
   !q.cancel_requested_at&&!q.delivery_change_requested_at);
  const eligible=selectedReady&&allReady&&net>=due;
  const missingPayment=Math.max(0,due-net);
  const reason=eligible?'입금 확인':
   !selectedReady?'선택 상품·주문 상태 확인':
   !allReady?'최종 주문·가격 확정 대기':
   missingPayment>0?'미입금 '+money(missingPayment):
   '상태 확인 필요';
  return {payer,selected,orders,due,net,eligible,reason,
   buyerName:selected[0]?.q.buyer_name||state.quotes.find(q=>q.id===payer.charged_quote_id)?.buyer_name||'주문자'};
 });
 return {people:result,paid:result.filter(r=>r.eligible).length,
  canOrder:result.length===Number(batch.people)&&result.every(r=>r.eligible)};
}

/* Wholesale worksheet: only confirmed, unfulfilled, not-yet-ordered quote items.
   Private supplier/cost values must never be exposed outside this admin view. */
function procurementRows(){
 if(!state.admin||state.page!=='admin')return [];
 const byRoot=new Map(),rows=[];
 const payment=q=>{
  const root=q.bundle_parent_id||q.id;
  if(byRoot.has(root))return byRoot.get(root);
  const list=state.quotes.filter(x=>x.status!=='cancelled'&&(x.id===root||x.bundle_parent_id===root));
  const due=list.reduce((n,x)=>n+totalDue(x),0);
  const net=list.reduce((n,x)=>n+Number(x.amount_paid||0)-Number(x.amount_refunded||0),0);
  const ok=list.length>0&&list.every(x=>x.status==='confirmed'&&readyQuote(x))&&net>=due;
  byRoot.set(root,ok);return ok;
 };
 for(const q of state.quotes){
  if(q.status!=='confirmed')continue;
  for(const item of q.items||[]){
   if(['sold_out','received','delivered'].includes(item.fulfillment))continue;
   const batch=supplierItemBatch(item.id);
   if(q.supplier_ordered_at||item.supplier_ordered_at||batch?.ordered_at)continue;
   const info=state.productPrivateReady?state.productPrivate[item.product_id]:null;
   const raw=info?.wholesale_price;
   const n=raw===undefined||raw===null||raw===''?null:Number(raw);
   const unit=n!==null&&Number.isFinite(n)&&n>=0?n:null;
   const vendor=String(info?.supplier_name||'').trim()||'실제 도매업체 미등록';
   const issues=[];
   if(!state.productPrivateReady)issues.push('도매정보 로딩 전');
   else {
    if(!String(info?.supplier_name||'').trim())issues.push('실제 도매업체명 미등록');
    if(unit===null)issues.push('도매가 미등록');
   }
   if(!state.supplierBatchesReady)issues.push('배송비 배분 정보 확인 전');
   else if(!batch&&!q.supplier_shipping_manual_confirmed_at)issues.push('도매배송비 미확정');
   else if(batch&&!supplierBatchPaymentState(batch).canOrder)issues.push('같은 거래처 배분 참여자 입금 확인 대기');
   if(!payment(q))issues.push('입금·금액 확인 필요');
   if(q.cancel_requested_at||q.delivery_change_requested_at)issues.push('취소·수령 변경 확인');
   if(!['new','preparing'].includes(workflowStage(q))||item.fulfillment==='delayed')issues.push('상품 진행 단계 확인');
   if(!state.optionRequestsReady)issues.push('옵션 변경요청 확인 전');
   else if(pendingItemOptionRequests(q).length)issues.push('옵션 변경요청 확인');
   rows.push({q,item,vendor,unit,qty:Number(item.quantity)||0,
    retail:item.unit_price===null?null:Number(item.unit_price),issues,ready:issues.length===0});
  }
 }
 return rows;
}
function procurementGroups(rows){
 const map=new Map();
 for(const r of rows){
  let v=map.get(r.vendor);
  if(!v){v={name:r.vendor,products:new Map(),qty:0,cost:0,missing:0};map.set(r.vendor,v)}
  const i=r.item;
  const key=JSON.stringify([i.product_id||i.store_name+'|'+i.product_name,i.color,i.size,r.unit]);
  let x=v.products.get(key);
  if(!x){
   x={name:i.product_name,color:i.color,size:i.size,unit:r.unit,qty:0,cost:0,
    sale:0,saleUnits:new Set(),saleMissing:0,people:[],issues:new Set()};
   v.products.set(key,x);
  }
  x.qty+=r.qty;v.qty+=r.qty;
  if(r.unit===null)v.missing+=r.qty;
  else {x.cost+=r.unit*r.qty;v.cost+=r.unit*r.qty}
  if(r.retail===null)x.saleMissing+=r.qty;
  else {x.sale+=r.retail*r.qty;x.saleUnits.add(r.retail)}
  x.people.push(buyerLabel(r.q)+' ×'+r.qty);
  r.issues.forEach(t=>x.issues.add(t));
 }
 return [...map.values()].sort((a,b)=>a.name.localeCompare(b.name,'ko')).map(v=>({
  ...v,products:[...v.products.values()].sort((a,b)=>a.name.localeCompare(b.name,'ko')||a.color.localeCompare(b.color,'ko')||a.size.localeCompare(b.size,'ko'))
 }));
}
function procurementCopyText(readyOnly=false,vendorName=null){
 const rows=procurementRows().filter(r=>(!readyOnly||r.ready)&&(vendorName===null||r.vendor===vendorName));
 if(!rows.length)throw Error('복사할 상품이 없어요.');
 const chunks=[readyOnly?'[미니예나] 입금·배송비 확인 완료 발주서':'[미니예나] 최종 확정 주문 검토 목록',
 '도매배송비 별도 / 발주 완료·품절·입고완료 제외'];
 if(!readyOnly)chunks.push('주의: 배송비 배분·입금 미확인 상품이 포함될 수 있어요.');
 for(const vendor of procurementGroups(rows)){
  chunks.push('', '■ 도매처 '+vendor.name);
  for(const p of vendor.products){
   chunks.push('- '+p.name+' / '+p.color+' / '+p.size+' / '+p.qty+'개 / 도매단가 '+(p.unit===null?'미등록':money(p.unit))+' / 도매금액 '+(p.unit===null?'미등록':money(p.cost))+' / 판매금액 '+money(p.sale));
   if(p.issues.size)chunks.push('  확인: '+[...p.issues].join(', '));
   chunks.push('  주문자 '+p.people.join(', '));
  }
  chunks.push('도매처 합계 '+vendor.qty+'개 · 매입 '+money(vendor.cost)+(vendor.missing?' (원가 미등록 '+vendor.missing+'개 제외)':''));
 }
 return chunks.join('\n');
}

   <div class="procurement-sheet-subtotal"><span>총 ${v.qty}개</span><span>매입 ${money(v.cost)}${v.missing?' (부분 합계)':''}</span></div>

 </details>`).join('');

function renderEmailNotificationSettings(){
 const s=state.emailSettings;
 if(!state.emailSettingsReady)return `<section class="card admin-notification-settings"><h3>Gmail 고객 자동 안내</h3><p class="smallnote">발송 상태를 확인하지 못했어요. ${esc(state.emailSettingsError||'로그인 후 다시 확인해 주세요.')}</p><button class="btn sm secondary" type="button" data-action="reload-email-settings">상태 다시 확인</button></section>`;
 const ready=Boolean(s.connected);
 const counters=`<div class="admin-mail-queue"><span>대기 중 <b>${Number(s.pending)||0}건</b></span><span>Gmail 발송 성공 <b>${Number(s.sent)||0}건</b></span><span>오류 <b>${Number(s.failed)||0}건</b></span></div>`;
 const controls=`
  <form id="gmail-settings-form">
   <label class="stageradio"><input name="enabled" type="checkbox" ${s.enabled?'checked':''}> 고객에게 상태 변경 이메일 자동 발송 사용</label>
   <button type="submit" class="btn block">자동 발송 설정 저장</button>
  </form>
  ${counters}
  ${s.last_failure&&Number(s.failed)>0?`<p class="admin-mail-recent-error"><b>${s.last_failure==='HTTP 403'?'이전 서비스(Resend) 발송 실패 기록:':'최근 발송 실패:'}</b> ${s.last_failure==='HTTP 403'?'Gmail 연결 전에 발생한 오류예요. 현재 Gmail 연결 오류가 아닙니다.':esc(s.last_failure)}</p>`:''}
  ${Number(s.failed)>0?`<button class="btn sm secondary" type="button" data-action="retry-failed-email" ${!ready?'disabled':''}>오류 메일 다시 시도</button>`:''}
  <button class="btn sm secondary" type="button" data-action="reload-email-settings">Gmail 연결 상태 새로고침</button>
  <p class="smallnote">서버가 약 1분 간격으로 발송해요. Gmail 일일 발송 한도가 적용되며 발송 성공이 수신함 도착을 보장하지는 않아요. 고객 이메일 주소는 각 견적·상품 신청에서 수정할 수 있어요.</p>`;
 if(ready){
  return `<section class="card admin-notification-settings is-compact" aria-label="Gmail 고객 자동 안내">
   <details class="admin-mail-details">
    <summary>
     <span class="admin-mail-summary-title">✉ Gmail 자동 발송 <strong class="${s.enabled?'':'is-off'}">${s.enabled?'켜짐':'꺼짐'}</strong></span>
     <span class="admin-mail-summary-meta">성공 ${Number(s.sent)||0}건${Number(s.failed)>0?' · 오류 '+Number(s.failed)+'건':''}</span>
     <span class="admin-mail-summary-action">설정</span>
    </summary>
    <div class="admin-mail-expanded">
     <div class="admin-mail-status"><strong>Gmail 연결 완료</strong><span>발신: ${esc(s.from_email||'기존 Gmail 계정')}</span></div>
     ${controls}
    </div>
   </details>
  </section>`;
 }
 return `<section class="card admin-notification-settings">
  <h3>Gmail 고객 자동 안내</h3>
  <div class="admin-mail-status"><strong>Gmail 연결 준비 중</strong><span>발신: ${esc(s.from_email||'기존 Gmail 계정')}</span></div>
  <div class="admin-mail-blocker"><b>Google Apps Script 배포 확인이 필요해요.</b><p>기존 Gmail 웹앱을 새 버전으로 배포하면 서버가 자동으로 연결 상태를 확인해요. 관리자 알림과 롯데택배 기능은 유지돼요.</p><p>${esc(s.blocked_reason||'메일 연결을 확인 중이에요.')}</p></div>
  ${controls}
 </section>`;
}

function composeBulkOptions(existingText,colorsInput,sizesInput){

async function adminBundleStage(id,stage,carrier='',tracking=''){
 const q=state.quotes.find(x=>x.id===id);
 if(!q)throw Error('묶음배송 주문을 찾을 수 없어요.');
 const rootId=bundleRootId(q);
 const targets=state.quotes.filter(x=>bundleRootId(x)===rootId&&x.status!=='cancelled');
 if(targets.length<2||targets.some(x=>x.status!=='confirmed'))throw Error('확정된 묶음배송 주문만 일괄 변경할 수 있어요.');
 if(connected){
  return rpc('gq_set_bundle_stage_v24',{
   p_quote_id:rootId,p_stage:stage,p_carrier:carrier||null,p_tracking_number:tracking||null

 // 오프라인 체험 모드 역시 두 주문의 진행 단계를 함께 변경합니다.
 const root=targets.find(x=>x.id===rootId)||targets[0];
 for(const x of targets){
  const row=demo.quotes.find(y=>y.id===x.id);
  if(!row)continue;
  const before=workflowStage(x);
  if(!row.delivery_method&&root.delivery_method)row.delivery_method=root.delivery_method;
  if(stage==='shipped'){
   if(!['new','preparing','shipped'].includes(before))throw Error('이미 완료된 주문이 있어요.');
   if(before==='shipped'&&row.tracking_number!==tracking)throw Error('서로 다른 송장번호가 있어요.');
   row.tracking_carrier=carrier;row.tracking_number=tracking;
   demo.items.filter(i=>i.quote_id===x.id&&['ordered','delayed'].includes(i.fulfillment)).forEach(i=>i.fulfillment='received');
  }
  if(stage==='completed')demo.items.filter(i=>i.quote_id===x.id&&i.fulfillment==='received').forEach(i=>i.fulfillment='delivered');
  row.workflow_stage=stage;row.workflow_updated_at=now();
 }
 saveDemo();return true;
}

app.addEventListener('keydown',keyAdminPhotoMove);
window.addEventListener('scroll',updateScrollTop,{passive:true});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)updateProcurementSchedule()});
setInterval(updateProcurementSchedule,60000);
window.addEventListener('popstate',()=>{const pp=new URLSearchParams(location.search);state.page=pp.get('page')||'shop';state.trackId=pp.get('id')||'';state.trackToken=pp.get('token')||'';state.modal=null;render();if(state.page==='track')reloadTracking().catch(e=>notif(errorText(e)));if(state.page==='admin')loadAdmin().catch(e=>notif(errorText(e)))});
(async()=>{
 try{
  if(state.page==='admin')await loadAdmin();
  else if(state.page==='track'){
   // Show the order screen immediately and fetch the private order independently.
   // A slow product catalog must never block a customer's emailed quote link.
   render();
   await reloadTracking();
   loadCatalog().catch(e=>console.warn('주문조회 중 상품 목록 지연:',e));
  }else await loadPublic();
 }catch(e){
  console.error('미니예나 초기 로딩 오류:',e);
  try{render()}catch(renderError){
   console.error('오류 화면 표시 실패:',renderError);
   app.innerHTML='<div class="loading"><b>미니예나를 열 수 없어요.</b><p>주소를 확인하거나 새로고침을 눌러 주세요.</p><button onclick="location.reload()">다시 불러오기</button></div>';
  }
  notif(errorText(e));
 }
})();
// Banner metadata is loaded with public catalog results.
})();

</script>
</body>
</html>

const buyerLabel=q=>String(q.buyer_name||'이름 미입력')+' · '+(q.baby_name||'아기 이름 미입력');
const normKey=x=>String(x||'').trim().replace(/\s+/g,'').toLowerCase();
// 같은 이름만으로 묶지 않습니다. 아기 이름이 없는 옛 주문은 개별 건으로 유지합니다.
const buyerIdentity=q=>{
 const a=normKey(q.buyer_name),b=normKey(q.baby_name),c=normKey(q.contact);
 if(!b)return 'old:'+q.id;
 if(c.length>=6)return 'contact:'+a+'|'+b+'|'+c;
 if(q.customer_key)return 'device:'+a+'|'+b+'|'+q.customer_key;
 return 'unique:'+q.id;
};
function customerGroups(){const m=new Map();for(const q of state.quotes){const id=buyerIdentity(q);let x=m.get(id);if(!x){x={key:id,name:q.buyer_name,baby:q.baby_name||'',contact:q.contact||'',orders:[],spent:0,netPaid:0,units:0,confirmed:0,pending:0,cancelled:0};m.set(id,x)}x.orders.push(q);x.netPaid+=(Number(q.amount_paid)||0)-(Number(q.amount_refunded)||0);if(q.status==='confirmed'){x.confirmed++;x.spent+=totalDue(q);x.units+=(q.items||[]).filter(i=>i.fulfillment!=='sold_out').reduce((a,i)=>a+i.quantity,0)}else if(q.status==='requested'||q.status==='quoted')x.pending++;else if(q.status==='cancelled')x.cancelled++}return [...m.values()].sort((a,b)=>b.spent-a.spent||a.name.localeCompare(b.name,'ko'))}
function productBuyerGroups(){const m=new Map();for(const q of state.quotes.filter(q=>q.status!=='cancelled'))for(const i of q.items||[]){if(i.fulfillment==='sold_out')continue;const id=JSON.stringify([i.product_id||null,i.store_name,i.product_name,i.color,i.size]);let x=m.get(id);if(!x){x={store:i.store_name,product:i.product_name,color:i.color,size:i.size,confirmed:[],pending:[],confirmedQty:0,pendingQty:0};m.set(id,x)}const row={q,qty:i.quantity,subtotal:i.unit_price==null?null:i.quantity*Number(i.unit_price)};if(q.status==='confirmed'){x.confirmed.push(row);x.confirmedQty+=i.quantity}else if(q.status==='requested'||q.status==='quoted'){x.pending.push(row);x.pendingQty+=i.quantity}}return [...m.values()].sort((a,b)=>a.store.localeCompare(b.store,'ko')||a.product.localeCompare(b.product,'ko')||a.color.localeCompare(b.color,'ko')||a.size.localeCompare(b.size,'ko'))}

const demoNotice=()=>!connected?'<div class="noticebar"><b>⚠️ 현재 체험 모드</b>견적 요청과 주문 확정은 이 아이폰 안에서만 저장돼요. 여러 사람이 실제로 주문하려면 <b>Supabase 연결이 먼저 필요</b>해요. 체험 중 만든 주문은 공유되지 않습니다.</div>':'';
const img=(p,cls='product-cover')=>p?.image_url?`<img class="${cls}" src="${esc(p.image_url)}" alt="${esc(p.name)} 대표사진" loading="lazy">`:`<div class="producticon">🧸</div>`;
async function showRequestImages(){if(!connected||!state.admin)return;const nodes=[...document.querySelectorAll('[data-request-photo]')];if(!nodes.length)return;const token=await getToken();for(const el of nodes){const path=el.dataset.requestPhoto;if(!path)continue;if(requestImageCache.has(path)){const saved=await requestImageCache.get(path);if(el.isConnected&&saved)el.src=saved;continue}const task=(async()=>{try{const resp=await fetch(url+'/storage/v1/object/authenticated/'+PHOTO_PRIVATE+'/'+path.split('/').map(encodeURIComponent).join('/'),{headers:{apikey:key,Authorization:'Bearer '+token}});if(!resp.ok)throw Error('사진 조회 실패');return URL.createObjectURL(await resp.blob())}catch(e){console.error('신청 사진 표시 오류',e);return null}})();requestImageCache.set(path,task);const value=await task;if(el.isConnected&&value)el.src=value;}}
function header(){return `<header class="hero"><div class="headrow"><div><div class="eyebrow">남대문 공동구매 · 견적제</div><div class="logo">공구노트 ${state.page==='admin'?'관리자':state.page==='track'?'내 견적':'쇼핑'}</div></div><button class="heroaction" data-page="${state.page==='admin'?'shop':'admin'}">${state.page==='admin'?'주문자 화면':'관리자'}</button></div><p>가게별 상품 선택 → 견적 요청 → 가격 확인 → 최종 주문</p><div class="v3top"><button class="btn sm secondary" data-page="shop">상품 구경</button><button class="btn sm secondary" data-action="suggest-product">+ 상품 등록 신청</button><button class="btn sm secondary" data-action="my-quotes">내 견적 확인</button></div></header>`}
function render(){app.innerHTML=`<main class="shell">${header()}${demoNotice()}${state.page==='admin'?renderAdmin():state.page==='track'?renderTrack():renderShop()}</main>${renderModal()}`;if(state.admin)queueMicrotask(()=>showRequestImages().catch(console.error));}
const steps=idx=>`<div class="quote-step">${['① 상품 담기','② 견적 요청','③ 가격 확인','④ 최종 주문'].map((x,i)=>`<span class="${i===idx?'current':''}">${x}</span>${i<3?'<i></i>':''}`).join('')}</div>`;
function renderShop(){let stores=state.stores.filter(s=>s.active&&state.products.some(p=>p.store_id===s.id&&p.published&&(!state.search||p.name.includes(state.search)||s.name.includes(state.search))));return `<section class="content">${steps(0)}<div class="sectiontitle"><div><h2>가게별 상품 고르기</h2><p class="sub">가격을 몰라도 견적 요청할 수 있어요. 상품이 없으면 등록 신청부터 해주세요.</p></div><div class="row wrap"><button class="btn secondary sm" data-action="suggest-product">+ 상품 신청</button><button class="btn secondary sm" data-action="open-cart">장바구니 ${cartCount()}</button></div></div><input id="search" type="search" placeholder="가게·옷 이름 검색" value="${esc(state.search)}" aria-label="검색"><div class="shoplist">${stores.map(s=>`<div class="storetitle">🏬 ${esc(s.name)}</div><div class="productgrid">${state.products.filter(p=>p.published&&p.store_id===s.id&&(!state.search||p.name.includes(state.search)||s.name.includes(state.search))).map(p=>`<div class="productcard">${img(p)}<div class="producttitle">${esc(p.name)}</div><div class="tiny">${Object.keys(p.options||{}).map(esc).join(' · ')}</div><div class="tiny">사이즈는 컬러 선택 후 표시</div><div class="grow"></div><button class="btn block" data-action="pick-product" data-id="${esc(p.id)}">옵션 선택</button></div>`).join('')}</div>`).join('')||'<div class="empty">등록된 상품이 없어요.</div>'}</div></section>${state.cart.length?`<div class="dock"><div class="main"><strong>장바구니 ${cartCount()}개</strong><div class="tiny">상품을 모아 한 번에 견적 요청</div></div><button class="btn" data-action="open-cart">견적 요청하기 →</button></div>`:''}`}
function renderTrack(){const q=state.tracking;return `<section class="content">${steps(!q?1:q.status==='requested'?1:q.status==='quoted'?2:3)}${!state.trackId||!state.trackToken?'<div class="empty">견적 내역에서 확인할 요청을 선택해 주세요.</div>':!q?'<div class="card">견적을 불러오는 중이거나 요청서를 찾지 못했어요.<div class="space"></div><button class="btn secondary" data-action="load-track">다시 불러오기</button></div>':`<div class="card"><div class="row between"><h2 style="margin:0">${esc(q.buyer_name)}님 견적</h2><span class="stagebadge">${statusLabel[q.status]}</span></div><div class="smallnote">아기 이름(태명): ${esc(q.baby_name||'미입력 (이전 견적)')} · 접수 ${fmtDate(q.created_at)} · 견적번호 ${q.id.slice(0,8).toUpperCase()}</div><div class="info">회원가입 없이 이용하는 견적이에요. <b>아래 비밀 확인 링크를 복사해서 보관</b>해 주세요. 같은 이름의 다른 주문과 자동으로 연결되지는 않아요.</div><div class="separator"></div>${q.items.map(i=>`<div class="cartline"><div class="row between"><b>${esc(i.store_name)} · ${esc(i.product_name)}</b><span>${i.quantity}개</span></div><div class="sub">${esc(i.color)} / ${esc(i.size)}</div><div class="money">${i.unit_price==null?'가격 안내 전':money(i.unit_price*i.quantity)}${i.unit_price!=null?` <span class="tiny">(${money(i.unit_price)} × ${i.quantity})</span>`:''}</div>${q.status==='confirmed'?`<div class="tiny">상태: ${fulfillmentLabel[i.fulfillment]||'주문'}</div>`:''}</div>`).join('')}<div class="separator"></div><div class="sumline"><span>상품 합계</span><b>${unknown(q)?'가격 확인 중':money(previewOrderSum(q))}</b></div><div class="sumline"><span>배송비</span><b>${q.status==='requested'?'견적 안내 전':shippingLabel(q)}</b></div><div class="sumline total"><span>최종 결제금액</span><b>${q.status==='requested'||!readyQuote(q)?'견적 확인 중':money(totalDue(q))}</b></div>${q.status==='requested'?'<div class="info">운영자가 가격을 확인 중이에요. 견적이 올라오면 이 화면에서 확인한 뒤 최종 주문해 주세요.</div>':q.status==='quoted'?`<div class="info">가격을 확인한 뒤 아래 버튼을 눌러야 <b>최종 주문</b>이 확정돼요. 아직 주문 확정 전입니다.</div><button class="btn block" data-action="confirm-quote" ${!readyQuote(q)||q.cancel_requested_at?'disabled':''}>견적 확인 후 최종 주문하기</button>`:q.status==='confirmed'?`<div class="info">✅ 최종 주문 완료! 운영자가 미송·품절 등 상태를 안내할 거예요.</div><div class="tiny">입금 확인: ${money(q.amount_paid||0)} / 환불 완료: ${money(q.amount_refunded||0)}</div>`:'<div class="noticefail">취소된 견적입니다.</div>'}${q.cancel_requested_at&&q.status!=='cancelled'?`<div class="noticefail"><b>취소 요청 접수됨</b><div>관리자가 확인 후 취소 여부를 처리해요. 최종 주문은 잠시 진행하지 말아 주세요.</div>${q.cancel_reason?`<div class="tiny">요청 사유: ${esc(q.cancel_reason)}</div>`:''}</div>`:q.cancel_rejected_at&&q.status!=='cancelled'?'<div class="noticefail">관리자가 이전 취소 요청을 반려했어요. 여전히 취소가 필요하면 다시 요청할 수 있어요.</div>':''}
${['requested','quoted','confirmed'].includes(q.status)&&!q.cancel_requested_at?`<button class="btn block outline" style="margin-top:12px" data-action="request-cancel">취소 요청하기</button>`:''}
<button class="btn block neutral" style="margin-top:12px" data-action="copy-track">견적 확인 링크 복사</button><button class="btn block secondary" style="margin-top:7px" data-action="load-track">새로고침</button></div>`}</section>`}
function renderAdmin(){if(connected&&!state.admin)return `<section class="content"><div class="card loginbox"><h2>관리자 로그인</h2><p class="sub">상품·가격·배송비·품절·미송·입금은 관리자만 변경해요.</p><form id="login"><label class="label">이메일<input required name="email" type="email" autocomplete="email"></label><label class="label">비밀번호<input required name="password" type="password" autocomplete="current-password"></label><button class="btn block" type="submit">로그인</button></form></div></section>`;
const nQuote=state.quotes.filter(q=>q.status==='requested').length,nConfirm=state.quotes.filter(q=>q.status==='confirmed').length;
return `<section class="content"><div class="three"><div class="tile"><small>견적 요청</small><strong>${nQuote}</strong>${state.quotes.some(q=>q.cancel_requested_at&&q.status!=='cancelled')?`<div class="tiny attention" style="margin-top:6px">취소 요청 ${state.quotes.filter(q=>q.cancel_requested_at&&q.status!=='cancelled').length}건</div>`:''}</div><div class="tile"><small>확정 주문</small><strong>${nConfirm}</strong></div><div class="tile"><small>등록 상품</small><strong>${state.products.length}</strong></div></div><div class="tabs" style="padding:14px 0"><button class="tab ${state.tab==='quotes'?'active':''}" data-tab="quotes">견적·주문</button><button class="tab ${state.tab==='requests'?'active':''}" data-tab="requests">상품 등록 신청 ${state.requests.filter(x=>x.status==='pending').length}</button><button class="tab ${state.tab==='products'?'active':''}" data-tab="products">가게·상품 등록</button><button class="tab ${state.tab==='buyers'?'active':''}" data-tab="buyers">구매자별 집계</button><button class="tab ${state.tab==='items'?'active':''}" data-tab="items">상품별 주문자</button><button class="tab ${state.tab==='vendors'?'active':''}" data-tab="vendors">가게별 발주</button><button class="tab ${state.tab==='settings'?'active':''}" data-tab="settings">설정</button></div>${state.tab==='quotes'?renderAdminQuotes():state.tab==='requests'?renderAdminRequests():state.tab==='products'?renderAdminProducts():state.tab==='buyers'?renderBuyerStats():state.tab==='items'?renderProductStats():state.tab==='vendors'?renderVendorSummary():renderAdminSettings()}</section>`}
function renderAdminRequests(){const requests=state.requests||[];return `<div class="sectiontitle"><div><h2>고객 상품 등록 신청</h2><div class="sub">사진과 거래처 확인 후 네가 직접 상품을 등록해요. 신청만으로는 판매 목록에 노출되지 않아요.</div></div><button class="btn secondary sm" data-action="refresh">새로고침</button></div>${!requests.length?'<div class="empty">아직 등록 신청이 없어요.</div>':requests.map(r=>`<div class="card request-card"><div class="row between"><div><span class="chip ${r.status==='pending'?'orange':r.status==='approved'?'green':''}">${r.status==='pending'?'검토 대기':r.status==='approved'?'상품 등록 완료':'반려'}</span><div class="tiny">${fmtDate(r.created_at)}</div></div><div class="tiny">${esc(r.customer_name||'신청자 미기재')}</div></div><img class="request-photo" data-request-photo="${esc(r.photo_path)}" alt="신청 상품 사진" loading="lazy"><div class="smallnote">남대문 도매업체</div><h3 style="margin:2px 0 9px">${esc(r.store_name)}</h3><div class="smallnote">상품명</div><b>${esc(r.product_name)}</b>${r.note?`<p class="sub">요청 내용: ${esc(r.note)}</p>`:''}${r.status==='pending'?`<div class="row wrap" style="margin-top:12px"><button class="btn sm" data-action="approve-request" data-id="${r.id}">검토 후 상품 등록</button><button class="btn sm danger" data-action="reject-request" data-id="${r.id}">반려</button></div>`:''}</div>`).join('')}`}
function renderAdminProducts(){return `<div class="sectiontitle"><div><h2>남대문 거래처</h2><div class="sub">가게를 먼저 등록해요.</div></div><button class="btn sm" data-action="add-store">+ 가게</button></div>${state.stores.map(s=>`<div class="card"><div class="row between"><b>🏬 ${esc(s.name)}</b><button class="btn sm secondary" data-action="edit-store" data-id="${s.id}">수정</button></div><div class="tiny">${state.products.filter(p=>p.store_id===s.id).length}개 상품 · ${s.active?'사용 중':'숨김'}</div></div>`).join('')||'<div class="empty">가게부터 등록해 주세요.</div>'}<div class="sectiontitle" style="margin-top:22px"><div><h2>가게별 상품</h2><div class="sub">각 컬러마다 다른 사이즈 등록 가능</div></div><button class="btn sm" data-action="add-product" ${!state.stores.length?'disabled':''}>+ 상품</button></div>${state.products.map(p=>`<div class="card"><div class="row between"><div class="row"><span>${p.image_url?img(p,'product-thumb'):'🧸'}</span><div><div class="tiny">${esc(storeName(p.store_id))}</div><b>${esc(p.name)}</b></div></div><button class="btn sm secondary" data-action="edit-product" data-id="${p.id}">수정</button></div><div class="form-options">${Object.entries(p.options||{}).map(([c,ss])=>`<div><b>${esc(c)}</b> : ${ss.map(esc).join(', ')}</div>`).join('')}</div><span class="chip ${p.published?'green':''}">${p.published?'공개 중':'숨김'}</span></div>`).join('')||'<div class="empty">상품을 등록해 주세요.</div>'}`}
function renderAdminQuotes(){let qq=state.quotes.filter(q=>state.filter==='all'||(state.filter==='cancel_requested'?!!q.cancel_requested_at&&q.status!=='cancelled':q.status===state.filter));return `<div class="row between"><h2>견적 및 확정 주문</h2><button class="btn sm secondary" data-action="refresh">새로고침</button></div><div class="controls" style="margin-bottom:10px">${['all','cancel_requested','requested','quoted','confirmed','cancelled'].map(s=>`<button class="tab ${state.filter===s?'active':''}" data-filter="${s}">${s==='all'?'전체':s==='cancel_requested'?'취소 요청':statusLabel[s]}</button>`).join('')}</div>${qq.map(q=>`<div class="card ordercard"><div class="row between"><div><h3>${esc(q.buyer_name)} <span class="chip purple">아기: ${esc(q.baby_name||'미입력')}</span></h3><button class="textbutton" data-action="edit-baby" data-id="${q.id}">아기 이름 수정</button><div class="quote-date">${fmtDate(q.created_at)} · ${esc(q.contact||'연락처 없음')}</div></div><span class="stagebadge">${statusLabel[q.status]}</span></div><div class="tiny">메모: ${esc(q.note||'없음')}</div>
${q.cancel_requested_at&&q.status!=='cancelled'?`<div class="noticefail" style="margin-top:10px"><b>⚠️ 구매자 취소 요청</b><div class="tiny">${fmtDate(q.cancel_requested_at)} · 사유: ${esc(q.cancel_reason||'사유 미입력')}</div><div class="row wrap" style="margin-top:8px"><button class="btn sm danger" data-action="accept-cancel" data-id="${q.id}">취소 승인</button><button class="btn sm neutral" data-action="reject-cancel" data-id="${q.id}">취소 요청 반려</button></div></div>`:q.cancel_rejected_at&&q.status!=='cancelled'?'<div class="tiny" style="margin-top:7px">이전 취소 요청 반려됨</div>':''}
${q.items.map(i=>`<div class="orderitem"><div class="row between"><div class="grow"><b>${esc(i.store_name)} · ${esc(i.product_name)}</b><div class="tiny">${esc(i.color)} / ${esc(i.size)} · ${i.quantity}개</div></div><span class="money">${i.unit_price==null?'가격 미정':money(i.unit_price*i.quantity)}</span></div><div class="row wrap" style="margin-top:8px"><form class="controlinline" data-price="${i.id}"><input type="number" min="0" max="100000000" placeholder="개당 가격" value="${i.unit_price??''}" name="price" aria-label="개당 가격" ${q.status==='confirmed'?'disabled':''}><button type="submit" class="btn sm secondary" ${q.status==='confirmed'?'disabled':''}>가격 저장</button></form>${q.status==='confirmed'?`<select class="statusselect" data-fulfillment="${i.id}" aria-label="미송 및 품절 상태">${Object.entries(fulfillmentLabel).map(([k,v])=>`<option value="${k}" ${i.fulfillment===k?'selected':''}>${v}</option>`).join('')}</select>`:''}</div></div>`).join('')}<form data-shipping="${q.id}" class="row wrap shipping-form"><label class="label" style="min-width:0;flex:1">이 주문의 배송비 (원, 무료면 0)<input name="shipping" type="number" min="0" max="1000000" step="1" required placeholder="배송비 입력 / 무료는 0" value="${hasShipping(q)?q.shipping_fee:''}" ${q.status==='confirmed'||q.status==='cancelled'?'disabled':''}></label><button type="submit" class="btn sm secondary" ${q.status==='confirmed'||q.status==='cancelled'?'disabled':''}>배송비 저장</button></form><div class="sumline"><span>총 ${q.items.reduce((n,i)=>n+i.quantity,0)}개 · 상품금액</span><strong>${unknown(q)?'가격 미정 '+unknown(q)+'개':money(previewOrderSum(q))}</strong></div><div class="sumline"><span>배송비</span><strong>${shippingLabel(q)}</strong></div><div class="sumline total"><span>고객 결제금액</span><strong>${readyQuote(q)?money(totalDue(q)):'견적 작성 중'}</strong></div>${q.status==='requested'?`<button class="btn block" data-action="publish-quote" data-id="${q.id}" ${!readyQuote(q)?'disabled':''}>${unknown(q)?'상품 가격을 먼저 입력해 주세요':!hasShipping(q)?'배송비를 먼저 입력해 주세요':'견적 안내 완료 처리'}</button>`:''}${q.status==='quoted'?'<div class="info">고객이 확인 후 ‘최종 주문’ 버튼을 눌러야 확정돼요.</div>':''}${['confirmed','cancelled'].includes(q.status)?`<form data-payment="${q.id}" class="two"><div><label class="label">받은 금액<input name="paid" type="number" min="0" value="${q.amount_paid||0}"></label></div><div><label class="label">환불 완료<input name="refunded" type="number" min="0" value="${q.amount_refunded||0}"></label></div><button type="submit" class="btn secondary" style="grid-column:span 2">입금·환불 금액 저장</button></form><div class="tiny">남은 금액: ${readyQuote(q)?money(Math.max(0,totalDue(q)-(q.amount_paid||0)+(q.amount_refunded||0))):'배송비 미설정 — 총액 확인 필요'}</div>`:''}<div class="row wrap" style="margin-top:10px"><button class="btn sm neutral" data-action="copy-quote" data-id="${q.id}">견적 내용 복사</button><button class="btn sm neutral" data-action="copy-customer-link" data-id="${q.id}">고객 확인 링크 복사</button><button class="btn sm danger" data-action="delete-order" data-id="${q.id}" aria-label="${esc(q.buyer_name)} 주문 영구 삭제">영구 삭제</button></div></div>`).join('')||'<div class="empty">해당 상태의 견적이 없어요.</div>'}`}

function renderBuyerStats(){const groups=customerGroups();const confirmed=groups.reduce((s,g)=>s+g.spent,0);return `<div class="sectiontitle"><div><h2>구매자별 구매 내역</h2><div class="sub">아기 이름까지 구분 · 확정 주문에 대해서만 구매금액 합산</div></div><button class="btn sm secondary" data-action="refresh">새로고침</button></div><div class="three" style="margin-bottom:13px"><div class="tile"><small>구분된 구매자</small><strong>${groups.length}명</strong></div><div class="tile"><small>확정 주문</small><strong>${groups.reduce((s,g)=>s+g.confirmed,0)}건</strong></div><div class="tile"><small>확정 주문금액</small><strong style="font-size:14px">${money(confirmed)}</strong></div></div><div class="identity-warning">동명이인 방지를 위해 주문자 이름 + 아기 이름 + 연락처(입력한 경우) 또는 같은 기기의 식별번호로 구분해요. 회원 계정이 없어 다른 기기에서 연락처도 입력하지 않으면 같은 사람인지 자동으로 확인할 수 없어요. 아기 이름이 없는 옛 주문은 개별로 표시돼요.</div><input id="stat-search" type="search" placeholder="주문자·아기 이름·연락처 검색"><div class="statlist">${groups.map(g=>`<div class="statcard" data-stats-entry><div class="row between"><div><b>${esc(g.name)} <span class="chip purple">${esc(g.baby||'아기 이름 미입력')}</span></b><div class="tiny">${esc(g.contact||'연락처 미입력')} · 확정 ${g.confirmed}건 / 견적 중 ${g.pending}건 / 취소 ${g.cancelled}건</div></div><strong>${money(g.spent)}</strong></div><div class="substats" style="margin-top:9px"><span>확정 수량 ${g.units}개</span><span>환불 차감 수령액 ${money(g.netPaid)}</span><span>전체 요청 ${g.orders.length}건</span></div><details><summary class="stats-summary"><span>견적·주문 건별 보기</span><span class="tiny">펼치기 ▾</span></summary>${g.orders.map(q=>`<div class="stat-detail"><div class="row between"><b>${esc(statusLabel[q.status])} · ${fmtDate(q.created_at)}</b><span>${q.status==='confirmed'?money(totalDue(q)):'총액 집계 제외'}</span></div><div class="tiny">${q.items.map(i=>esc(i.product_name)+' '+esc(i.color)+'/'+esc(i.size)+' ×'+i.quantity).join(' · ')}</div></div>`).join('')}</details></div>`).join('')||'<div class="empty">아직 견적 요청이 없어요.</div>'}</div>`}
function renderProductStats(){const groups=productBuyerGroups();return `<div class="sectiontitle"><div><h2>상품별 누가 주문했나요?</h2><div class="sub">가게·상품·컬러·사이즈별 주문자, 확정 수량과 견적 대기 수량 별도</div></div><button class="btn sm secondary" data-action="refresh">새로고침</button></div><div class="identity-warning">발주해야 할 수량은 ‘확정’ 수량만 확인해 주세요. 품절·취소는 제외하고 미송은 확정 수량에 포함돼요.</div><input id="stat-search" type="search" placeholder="가게·상품·컬러·주문자·아기 이름 검색"><div class="statlist">${groups.map(g=>`<div class="statcard" data-stats-entry><div class="smallnote">🏬 ${esc(g.store)}</div><h3 style="margin:3px 0 3px;font-size:15px">${esc(g.product)}</h3><div class="tiny">${esc(g.color)} / ${esc(g.size)}</div><div class="substats" style="margin-top:9px"><span>확정 ${g.confirmedQty}개</span><span>견적 중 ${g.pendingQty}개</span><span>확정 주문자 ${new Set(g.confirmed.map(x=>buyerIdentity(x.q))).size}명</span></div><details ${g.confirmed.length?'open':''}><summary class="stats-summary">확정 주문자 ${g.confirmed.length}건</summary>${g.confirmed.map(({q,qty,subtotal})=>`<div class="stat-detail"><div class="row between"><b>${esc(buyerLabel(q))}</b><strong>${qty}개</strong></div><div class="tiny">${fmtDate(q.created_at)} · ${subtotal==null?'금액 미정':money(subtotal)} ${q.cancel_requested_at?'· 취소 요청 중':''}</div></div>`).join('')||'<div class="tiny">확정 주문이 없어요.</div>'}</details>${g.pending.length?`<details><summary class="stats-summary">견적 요청·안내 중 ${g.pending.length}건 (미확정)</summary>${g.pending.map(({q,qty})=>`<div class="stat-detail"><div class="row between"><span>${esc(buyerLabel(q))} · ${esc(statusLabel[q.status])}</span><b>${qty}개</b></div></div>`).join('')}</details>`:''}</div>`).join('')||'<div class="empty">아직 상품 주문 데이터가 없어요.</div>'}</div>`}
function vendorGroups(){const g=new Map();for(const q of state.quotes.filter(q=>q.status==='confirmed'))for(const i of q.items){if(i.fulfillment==='sold_out')continue;const key=JSON.stringify([i.store_name,i.product_name,i.color,i.size]);let x=g.get(key);if(!x){x={store:i.store_name,product:i.product_name,color:i.color,size:i.size,qty:0,people:new Set()};g.set(key,x)}x.qty+=i.quantity;x.people.add(buyerLabel(q))}return [...g.values()].sort((a,b)=>a.store.localeCompare(b.store,'ko')||a.product.localeCompare(b.product,'ko'))}
function vendorText(){return vendorGroups().map(x=>`${x.store} / ${x.product} / ${x.color} / ${x.size} ×${x.qty}`).join('\n')||'확정된 발주 내역이 없어요'}
function renderVendorSummary(){const groups=vendorGroups(),stores=[...new Set(groups.map(g=>g.store))];return `<div class="sectiontitle"><div><h2>가게별 확정 발주</h2><div class="sub">최종 주문만 합산 · 품절 제외 · 미송 포함</div></div><button class="btn sm secondary" data-action="copy-vendors">전체 복사</button></div>${stores.map(name=>{const a=groups.filter(g=>g.store===name);return `<div class="card"><h3>🏬 ${esc(name)}</h3>${a.map(x=>`<div class="line"><div class="row between"><div><b>${esc(x.product)}</b><div class="tiny">${esc(x.color)} / ${esc(x.size)} · ${esc([...x.people].join(', '))}</div></div><strong>${x.qty}개</strong></div></div>`).join('')}<div class="sumline total"><span>이 가게 발주 수량</span><strong>${a.reduce((s,i)=>s+i.qty,0)}개</strong></div></div>`}).join('')||'<div class="empty">아직 확정된 주문이 없어요.</div>'}`}
function renderAdminSettings(){return `<div class="card"><h3>고객에게 보낼 주소</h3><p class="smallnote">상품 고르고 견적 요청을 보낼 수 있는 링크예요.</p><div class="info nooverflow">${esc(publicLink())}</div><button class="btn block" data-action="copy-shop-link">주문 링크 복사</button><div class="separator"></div><button class="btn block secondary" data-action="export-csv">주문 내역 CSV 저장</button>${connected?'<button class="btn block neutral" style="margin-top:9px" data-action="logout">관리자 로그아웃</button>':''}<p class="smallnote">가격·주문별 배송비·품절·미송·입금 상태는 관리자 전용입니다. 아직 견적만 요청한 상품은 확정 주문 수량에 포함되지 않아요.</p></div>`}
function modal(){const m=state.modal;if(!m)return '';const wrap=(title,body)=>`<div class="overlay" id="overlay"><div class="sheet" role="dialog" aria-modal="true"><div class="sheethead"><h2>${title}</h2><button class="close" data-action="close">×</button></div>${body}</div></div>`;
if(m.type==='suggest'){return wrap('상품 등록 신청',`<div class="filehelp">상품명·남대문 도매업체 이름·대표사진을 올려주세요. 관리자가 확인하고 승인한 뒤에만 실제 상품 목록에 등록돼요. <b>이 신청은 견적 요청이나 최종 주문이 아니에요.</b></div><form id="suggest-form" style="margin-top:16px"><label class="label">남대문 도매업체 이름<input required name="store" maxlength="100" placeholder="예: 오뜨베베"></label><label class="label">상품명<input required name="name" maxlength="100" placeholder="예: 하트호피 전신슈트"></label><label class="label">대표사진 첨부 (필수)<input name="photo" type="file" accept="image/*" required id="suggest-photo"></label><img class="photo-preview hidden" id="suggest-preview" alt="등록할 상품 사진 미리보기"><label class="label">신청자 이름 (선택)<input name="customer" maxlength="40" placeholder="누가 신청했는지 확인용"></label><label class="label">메모 (선택)<textarea name="note" maxlength="300" placeholder="상품에 대해 참고할 내용"></textarea></label><button class="btn block" type="submit">상품 등록 신청 보내기</button></form>`)}
if(m.type==='approve'){const r=state.requests.find(x=>x.id===m.id);if(!r)return '';return wrap('상품 등록 검토 및 승인',`<div class="info">신청자가 보낸 내용과 사진을 확인하고 컬러별 사이즈를 입력하면 실제 상품으로 등록돼요.</div><img class="request-photo" data-request-photo="${esc(r.photo_path)}" alt="신청 상품 대표사진"><form id="approve-form"><label class="label">남대문 도매업체 이름<input name="store" maxlength="100" required value="${esc(r.store_name)}"></label><label class="label">상품명<input name="name" maxlength="100" required value="${esc(r.product_name)}"></label><label class="label">컬러별 사이즈 옵션<textarea name="options" required rows="5" placeholder="크림: BS, BM&#10;핑크: XS, S, M"></textarea></label><div class="filehelp">한 줄에 컬러 하나씩 입력하세요. 예) 크림: BS, BM</div><label class="stageradio" style="margin:15px 0"><input type="checkbox" name="published" checked> 승인 후 상품을 바로 공개</label><button class="btn block" type="submit">대표사진 포함 상품 등록·승인</button></form>`)}
if(m.type==='pick'){const p=selectedProd(m.id),colors=Object.keys(p.options||{}),color=colors.includes(m.color)?m.color:colors[0],sizes=p.options[color]||[];return wrap('옵션 선택',`<div class="smallnote">${esc(storeName(p.store_id))}</div><h3>${esc(p.name)}</h3>${p.image_url?img(p,'request-photo'): ''}<form id="pick"><label class="label">컬러<select name="color" id="pickColor">${colors.map(c=>`<option ${c===color?'selected':''}>${esc(c)}</option>`).join('')}</select></label><label class="label">사이즈<select name="size" id="pickSize">${sizes.map(s=>`<option>${esc(s)}</option>`).join('')}</select></label><label class="label">수량<input type="number" name="qty" value="1" min="1" max="20" required></label><button class="btn block" type="submit">장바구니 담기</button></form>`)}
if(m.type==='cart'){return wrap('견적 요청 장바구니',`<div class="smallnote">여러 가게 상품을 한 번에 견적 요청할 수 있어요.</div>${state.cart.map((c,i)=>`<div class="cartline"><b>${esc(storeName(c.store_id))} · ${esc(c.product_name)}</b><div class="tiny">${esc(c.color)} / ${esc(c.size)} · ${c.quantity}개</div><button class="textbutton" data-action="cart-remove" data-i="${i}">삭제</button></div>`).join('')||'<div class="empty">장바구니에 담은 상품이 없어요.</div>'}${state.cart.length?`<form id="request"><label class="label">주문자 이름<input name="name" maxlength="40" required placeholder="예: 지현"></label><label class="label">아기 이름 또는 태명 (필수)<input name="baby" maxlength="40" required placeholder="예: 예나, 토리"></label><label class="label">연락처 (선택·동명이인 구분에 도움)<input name="contact" maxlength="80" placeholder="예: 010-0000-0000"></label><label class="label">요청 메모 (선택)<textarea name="note" maxlength="300" placeholder="거래처에 확인할 내용"></textarea></label><div class="info">지금은 <b>가격만 문의하는 견적 요청</b>이에요. 아직 주문이 확정되지 않아요. 제출 후 나오는 <b>고유 견적 링크를 꼭 보관</b>해 주세요. 같은 이름으로 다시 요청해도 자동으로 합쳐지지 않아요.</div><button class="btn block" type="submit">전체 ${cartCount()}개 견적 요청하기</button></form>`:''}`)}
if(m.type==='store'){const s=state.stores.find(x=>x.id===m.id);return wrap(s?'가게 수정':'가게 등록',`<form id="store-form"><label class="label">남대문 가게 이름<input name="name" maxlength="100" required value="${esc(s?.name||'')}" placeholder="예: 동대문상회"></label><label class="stageradio"><input type="checkbox" name="active" ${s?.active===false?'':'checked'}> 주문자 화면에 표시</label><button class="btn block" type="submit">가게 저장</button></form>`)}

function parseOptions(t){const result={};for(let line of t.split(/\n/)){if(!line.trim())continue;const j=line.indexOf(':');if(j<1)throw Error('옵션을 "크림: BS, BM" 형태로 입력해 주세요');const color=line.slice(0,j).trim(),ss=[...new Set(line.slice(j+1).split(/[,，]/).map(x=>x.trim()).filter(Boolean))];if(!ss.length)throw Error(color+' 컬러에 사이즈가 없어요');if(result[color])throw Error(color+' 컬러가 두 번 입력됐어요');if(color.length>50||ss.some(s=>s.length>30))throw Error('옵션 이름이 너무 길어요');result[color]=ss}if(!Object.keys(result).length||Object.keys(result).length>30)throw Error('컬러 1~30개를 등록해 주세요');return result}

async function toJpeg(input){if(!input||!input.type.startsWith('image/'))throw Error('이미지 파일을 선택해 주세요');if(input.size>35*1024*1024)throw Error('사진이 너무 커요. 다른 사진을 선택해 주세요');const objectURL=URL.createObjectURL(input),bitmap=new Image();try{await new Promise((resolve,reject)=>{bitmap.onload=resolve;bitmap.onerror=()=>reject(Error('사진을 읽을 수 없어요'));bitmap.src=objectURL});let w=bitmap.naturalWidth,h=bitmap.naturalHeight;if(!w||!h)throw Error('사진 크기를 확인할 수 없어요');const scale=Math.min(1,1600/Math.max(w,h));w=Math.max(1,Math.round(w*scale));h=Math.max(1,Math.round(h*scale));const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');if(!ctx)throw Error('사진 처리 오류');ctx.drawImage(bitmap,0,0,w,h);let blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.78));if(!blob)throw Error('사진을 변환할 수 없어요');if(blob.size>5*1024*1024)throw Error('압축 후에도 사진이 너무 커요');return blob}finally{URL.revokeObjectURL(objectURL)}}
async function uploadPhoto(file,bucket,admin=false){if(!connected)throw Error('온라인 연결이 필요해요');const blob=file.type==='image/jpeg'&&file instanceof Blob&&file.size<5*1024*1024?file:await toJpeg(file);const path=(bucket===PHOTO_PRIVATE?'incoming/':'covers/')+uuid()+'.jpg';const hdr={apikey:key,'Content-Type':'image/jpeg'};if(admin){const token=await getToken();hdr.Authorization='Bearer '+token}const res=await fetch(url+'/storage/v1/object/'+bucket+'/'+path,{method:'POST',headers:hdr,body:blob});if(!res.ok){let msg='사진 업로드 실패';try{let j=await res.json();msg=j.message||j.error||msg}catch{}throw Error(msg)}return path}

 if(!q)throw Error('주문을 찾을 수 없어요');
 if(!window.confirm(`${q.buyer_name}님의 주문을 영구 삭제할까요? 주문 상품과 가격·입금 기록이 모두 삭제되고 복구할 수 없어요.`))return;
 if((q.amount_paid||0)>0||q.status==='confirmed'){
   if(!window.confirm('확정되었거나 입금 기록이 있는 주문이에요. 환불·정산을 확인했나요? 영구 삭제 후에는 되돌릴 수 없어요.'))return;
 }
 if(window.prompt('실수 방지를 위해 ‘삭제’를 입력해 주세요.')!=='삭제')return;
 await deleteQuoteByAdmin(id);await loadAdmin();notif('주문을 영구 삭제했어요');
}else if(a==='close'){state.modal=null;render()}else if(a==='pick-product'){modalOpen('pick',id)}else if(a==='open-cart'){modalOpen('cart')}else if(a==='cart-remove'){state.cart.splice(Number(b.dataset.i),1);saveCart();modalOpen('cart')}else if(a==='suggest-product'){modalOpen('suggest')}else if(a==='approve-request'){modalOpen('approve',id)}else if(a==='reject-request'){if(!window.confirm('이 상품 신청을 반려할까요?'))return;await rejectSuggestion(id);await loadAdmin();notif('신청을 반려했어요')}else if(a==='add-store'||a==='edit-store'){modalOpen('store',a==='edit-store'?id:null)}else if(a==='add-product'||a==='edit-product'){modalOpen('product',a==='edit-product'?id:null)}else if(a==='my-quotes'){modalOpen('myquotes')}else if(a==='open-saved'){const r=findTrack(id);if(r)await openTracking(r.id,r.token)}else if(a==='refresh'){await loadAdmin();notif('새로고침 완료')}else if(a==='copy-shop-link'){await copy(publicLink())}else if(a==='copy-track'){await copy(trackLink(state.trackId,state.trackToken))}else if(a==='load-track'){await reloadTracking();notif('최신 상태를 불러왔어요')}else if(a==='copy-quote'){await copy(quoteText(state.quotes.find(q=>q.id===id)))}else if(a==='copy-customer-link'){const q=state.quotes.find(q=>q.id===id);await copy(trackLink(q.id,q.lookup_token))}else if(a==='publish-quote'){if(!window.confirm('가격 확인을 마쳤나요? 고객에게 견적을 보여줍니다.'))return;await adminPublish(id);await loadAdmin();notif('견적을 공개했어요')}else if(a==='confirm-quote'){if(!window.confirm('이 견적으로 최종 주문을 확정할까요?'))return;await confirmFinalQuote();notif('최종 주문이 확정됐어요!')}else if(a==='export-csv'){csv()}else if(a==='copy-vendors'){await copy(vendorText())}else if(a==='logout'){session=null;localStorage.removeItem(SESS);state.admin=false;render()} }catch(ex){notif(errorText(ex))}}
async function submit(e){const f=e.target;if(!['pick','request','store-form','product-form','login','suggest-form','approve-form'].includes(f.id)&&!f.dataset.price&&!f.dataset.payment&&!f.dataset.shipping)return;e.preventDefault();if(busy)return;busy=true;const data=new FormData(f);try{if(f.id==='suggest-form'){await submitSuggestion(data);state.modal=null;state.page='shop';await loadPublic();notif('상품 등록 신청이 접수됐어요! 관리자가 검토 후 등록해요')}
else if(f.id==='approve-form'){await approveSuggestion(data);state.modal=null;await loadAdmin();state.tab='requests';render();notif('상품을 등록하고 신청을 승인했어요')}
else if(f.id==='pick'){const pr=selectedProd(state.modal.id),color=data.get('color'),size=data.get('size'),quantity=Number(data.get('qty'));if(!pr?.options[color]?.includes(size)||quantity<1||quantity>20)throw Error('옵션을 다시 확인해 주세요');const same=state.cart.find(x=>x.product_id===pr.id&&x.color===color&&x.size===size);if(same)same.quantity+=quantity;else state.cart.push({product_id:pr.id,store_id:pr.store_id,product_name:pr.name,color,size,quantity});saveCart();state.modal=null;render();notif('장바구니에 담았어요')}
else if(f.id==='request'){const name=String(data.get('name')||'').trim(),baby=String(data.get('baby')||'').trim(),contact=String(data.get('contact')||'').trim(),note=String(data.get('note')||'').trim();if(!name||!baby)throw Error('주문자 이름과 아기 이름(태명)을 모두 입력해 주세요');const r=await requestQuote(name,baby,contact,note);state.receipts.unshift({id:r.id,token:r.token,name,baby,date:now()});saveTracks();state.cart=[];saveCart();await openTracking(r.id,r.token);notif('견적 요청이 접수됐어요. 이 링크를 보관해 주세요')}
else if(f.id==='store-form'){const name=String(data.get('name')).trim();await putStore({name,active:data.has('active')},state.modal.id);state.modal=null;await loadAdmin();notif('가게를 저장했어요')}
else if(f.id==='product-form'){const o={store_id:String(data.get('store')),name:String(data.get('name')).trim(),options:parseOptions(String(data.get('options'))),published:data.has('published')};const file=data.get('photo');if(file&&file.size){const pp=await uploadPhoto(await toJpeg(file),PHOTO_PUBLIC,true);o.image_url=publicPhotoUrl(pp)}await putProduct(o,state.modal.id);state.modal=null;await loadAdmin();notif('상품을 저장했어요')}
else if(f.id==='login'){if(!connected)throw Error('온라인 연결 설정을 먼저 해 주세요');const r=await fetch(url+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:key,'Content-Type':'application/json'},body:JSON.stringify({email:data.get('email'),password:data.get('password')})});const j=await r.json();if(!r.ok)throw Error(j.error_description||'로그인 실패');session={...j,expires_at:Math.floor(Date.now()/1000)+j.expires_in};localStorage.setItem(SESS,JSON.stringify(session));await loadAdmin();notif('관리자 로그인 완료')}
else if(f.dataset.shipping){const val=String(data.get('shipping')??'').trim();if(!/^\d{1,7}$/.test(val))throw Error('배송비를 숫자로 입력해 주세요. 무료는 0원이에요');await adminShipping(f.dataset.shipping,Number(val));await loadAdmin();notif('배송비 저장 완료')}
else if(f.dataset.price){const id=f.dataset.price,value=data.get('price');if(value===''||!Number.isInteger(Number(value))||Number(value)<0)throw Error('개당 가격을 입력해 주세요');await adminItemPrice(id,Number(value));await loadAdmin();notif('가격 저장 완료')}
else if(f.dataset.payment){const paid=Number(data.get('paid')),refunded=Number(data.get('refunded'));if(!Number.isInteger(paid)||!Number.isInteger(refunded)||paid<0||refunded<0)throw Error('금액을 확인해 주세요');await adminPayment(f.dataset.payment,paid,refunded);await loadAdmin();notif('입금 기록 완료')}
}catch(ex){notif(errorText(ex))}finally{busy=false}}
async function change(e){const x=e.target;if(x.id==='suggest-photo'&&x.files?.[0]){const preview=$('#suggest-preview');if(preview){preview.src=URL.createObjectURL(x.files[0]);preview.classList.remove('hidden')}return}if(x.id==='pickColor'){state.modal.color=x.value;const p=selectedProd(state.modal.id);$('#pickSize').innerHTML=(p.options[x.value]||[]).map(s=>`<option>${esc(s)}</option>`).join('')}else if(x.dataset.tab){state.tab=x.dataset.tab;render()}else if(x.dataset.filter){state.filter=x.dataset.filter;render()}else if(x.dataset.fulfillment){if(busy)return;busy=true;try{await adminFulfillment(x.dataset.fulfillment,x.value);await loadAdmin();notif('상태가 변경됐어요')}catch(ex){notif(errorText(ex))}finally{busy=false}}}
function input(e){if(e.target.id==='stat-search'){const query=e.target.value.trim().toLowerCase();for(const node of app.querySelectorAll('[data-stats-entry]'))node.classList.toggle('hidden',!!query&&!node.textContent.toLowerCase().includes(query));return;}if(e.target.id==='search'){state.search=e.target.value;const pos=e.target.selectionStart;render();const el=$('#search');if(el){el.focus();el.setSelectionRange(pos,pos)}}}
app.addEventListener('click',e=>{const tab=e.target.closest('[data-tab]'),filter=e.target.closest('[data-filter]');if(tab){state.tab=tab.dataset.tab;render();return}if(filter){state.filter=filter.dataset.filter;render();return}click(e)});
app.addEventListener('submit',submit);app.addEventListener('change',change);app.addEventListener('input',input);
window.addEventListener('popstate',()=>{const pp=new URLSearchParams(location.search);state.page=pp.get('page')||'shop';state.trackId=pp.get('id')||'';state.trackToken=pp.get('token')||'';state.modal=null;render();if(state.page==='track')reloadTracking().catch(e=>notif(errorText(e)));if(state.page==='admin')loadAdmin().catch(e=>notif(errorText(e)))});
(async()=>{try{if(state.page==='admin')await loadAdmin();else if(state.page==='track'){await loadCatalog();await reloadTracking()}else await loadPublic()}catch(e){render();notif(errorText(e))}})();
})();

</script>

async function getToken(){if(!session)return null;if(session.expires_at>Date.now()/1000+60)return session.access_token;if(refreshing)return refreshing;refreshing=(async()=>{try{const r=await fetch(url+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:key,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})});const j=await r.json();if(!r.ok)throw Error(j.error_description||'로그인 만료');session={...j,expires_at:Math.floor(Date.now()/1000)+j.expires_in};localStorage.setItem(SESS,JSON.stringify(session));return j.access_token}catch(e){session=null;localStorage.removeItem(SESS);throw e}finally{refreshing=null}})();return refreshing}

function render(){app.innerHTML=`<main class="shell">${header()}${demoNotice()}${state.page==='admin'?renderAdmin():state.page==='track'?renderTrack():renderShop()}</main>${renderModal()}`}
const steps=idx=>`<div class="quote-step">${['① 상품 담기','② 견적 요청','③ 가격 확인','④ 최종 주문'].map((x,i)=>`<span class="${i===idx?'current':''}">${x}</span>${i<3?'<i></i>':''}`).join('')}</div>`;
function renderShop(){let stores=state.stores.filter(s=>s.active&&state.products.some(p=>p.store_id===s.id&&p.published&&(!state.search||p.name.includes(state.search)||s.name.includes(state.search))));return `<section class="content">${steps(0)}<div class="sectiontitle"><div><h2>가게별 상품 고르기</h2><p class="sub">가격을 몰라도 견적 요청할 수 있어요.</p></div><button class="btn secondary sm" data-action="open-cart">장바구니 ${cartCount()}</button></div><input id="search" type="search" placeholder="가게·옷 이름 검색" value="${esc(state.search)}" aria-label="검색"><div class="shoplist">${stores.map(s=>`<div class="storetitle">🏬 ${esc(s.name)}</div><div class="productgrid">${state.products.filter(p=>p.published&&p.store_id===s.id&&(!state.search||p.name.includes(state.search)||s.name.includes(state.search))).map(p=>`<div class="productcard"><div class="producticon">🧸</div><div class="producttitle">${esc(p.name)}</div><div class="tiny">${Object.keys(p.options||{}).map(esc).join(' · ')}</div><div class="tiny">사이즈는 컬러 선택 후 표시</div><div class="grow"></div><button class="btn block" data-action="pick-product" data-id="${esc(p.id)}">옵션 선택</button></div>`).join('')}</div>`).join('')||'<div class="empty">등록된 상품이 없어요.</div>'}</div></section>${state.cart.length?`<div class="dock"><div class="main"><strong>장바구니 ${cartCount()}개</strong><div class="tiny">상품을 모아 한 번에 견적 요청</div></div><button class="btn" data-action="open-cart">견적 요청하기 →</button></div>`:''}`}
function renderTrack(){const q=state.tracking;return `<section class="content">${steps(!q?1:q.status==='requested'?1:q.status==='quoted'?2:3)}${!state.trackId||!state.trackToken?'<div class="empty">견적 내역에서 확인할 요청을 선택해 주세요.</div>':!q?'<div class="card">견적을 불러오는 중이거나 요청서를 찾지 못했어요.<div class="space"></div><button class="btn secondary" data-action="load-track">다시 불러오기</button></div>':`<div class="card"><div class="row between"><h2 style="margin:0">${esc(q.buyer_name)}님 견적</h2><span class="stagebadge">${statusLabel[q.status]}</span></div><div class="smallnote">접수 ${fmtDate(q.created_at)} · 요청번호 ${q.id.slice(0,8).toUpperCase()}</div><div class="separator"></div>${q.items.map(i=>`<div class="cartline"><div class="row between"><b>${esc(i.store_name)} · ${esc(i.product_name)}</b><span>${i.quantity}개</span></div><div class="sub">${esc(i.color)} / ${esc(i.size)}</div><div class="money">${i.unit_price==null?'가격 안내 전':money(i.unit_price*i.quantity)}${i.unit_price!=null?` <span class="tiny">(${money(i.unit_price)} × ${i.quantity})</span>`:''}</div>${q.status==='confirmed'?`<div class="tiny">상태: ${fulfillmentLabel[i.fulfillment]||'주문'}</div>`:''}</div>`).join('')}<div class="separator"></div><div class="sumline total"><span>견적 합계</span><b>${unknown(q)?'아직 계산 중':money(previewOrderSum(q))}</b></div>${q.status==='requested'?'<div class="info">운영자가 가격을 확인 중이에요. 견적이 올라오면 이 화면에서 확인한 뒤 최종 주문해 주세요.</div>':q.status==='quoted'?`<div class="info">가격을 확인한 뒤 아래 버튼을 눌러야 <b>최종 주문</b>이 확정돼요. 아직 주문 확정 전입니다.</div><button class="btn block" data-action="confirm-quote" ${unknown(q)?'disabled':''}>견적 확인 후 최종 주문하기</button>`:q.status==='confirmed'?`<div class="info">✅ 최종 주문 완료! 운영자가 미송·품절 등 상태를 안내할 거예요.</div><div class="tiny">입금 확인: ${money(q.amount_paid||0)} / 환불 완료: ${money(q.amount_refunded||0)}</div>`:'<div class="noticefail">취소된 견적입니다.</div>'}<button class="btn block neutral" style="margin-top:12px" data-action="copy-track">견적 확인 링크 복사</button><button class="btn block secondary" style="margin-top:7px" data-action="load-track">새로고침</button></div>`}</section>`}
function renderAdmin(){if(connected&&!state.admin)return `<section class="content"><div class="card loginbox"><h2>관리자 로그인</h2><p class="sub">상품·가격·품절·미송·입금은 관리자만 변경해요.</p><form id="login"><label class="label">이메일<input required name="email" type="email" autocomplete="email"></label><label class="label">비밀번호<input required name="password" type="password" autocomplete="current-password"></label><button class="btn block" type="submit">로그인</button></form></div></section>`;
const nQuote=state.quotes.filter(q=>q.status==='requested').length,nConfirm=state.quotes.filter(q=>q.status==='confirmed').length;
return `<section class="content"><div class="three"><div class="tile"><small>견적 요청</small><strong>${nQuote}</strong></div><div class="tile"><small>확정 주문</small><strong>${nConfirm}</strong></div><div class="tile"><small>등록 상품</small><strong>${state.products.length}</strong></div></div><div class="tabs" style="padding:14px 0"><button class="tab ${state.tab==='quotes'?'active':''}" data-tab="quotes">견적·주문</button><button class="tab ${state.tab==='products'?'active':''}" data-tab="products">가게·상품 등록</button><button class="tab ${state.tab==='vendors'?'active':''}" data-tab="vendors">가게별 발주</button><button class="tab ${state.tab==='settings'?'active':''}" data-tab="settings">설정</button></div>${state.tab==='quotes'?renderAdminQuotes():state.tab==='products'?renderAdminProducts():state.tab==='vendors'?renderVendorSummary():renderAdminSettings()}</section>`}
function renderAdminProducts(){return `<div class="sectiontitle"><div><h2>남대문 거래처</h2><div class="sub">가게를 먼저 등록해요.</div></div><button class="btn sm" data-action="add-store">+ 가게</button></div>${state.stores.map(s=>`<div class="card"><div class="row between"><b>🏬 ${esc(s.name)}</b><button class="btn sm secondary" data-action="edit-store" data-id="${s.id}">수정</button></div><div class="tiny">${state.products.filter(p=>p.store_id===s.id).length}개 상품 · ${s.active?'사용 중':'숨김'}</div></div>`).join('')||'<div class="empty">가게부터 등록해 주세요.</div>'}<div class="sectiontitle" style="margin-top:22px"><div><h2>가게별 상품</h2><div class="sub">각 컬러마다 다른 사이즈 등록 가능</div></div><button class="btn sm" data-action="add-product" ${!state.stores.length?'disabled':''}>+ 상품</button></div>${state.products.map(p=>`<div class="card"><div class="row between"><div><div class="tiny">${esc(storeName(p.store_id))}</div><b>${esc(p.name)}</b></div><button class="btn sm secondary" data-action="edit-product" data-id="${p.id}">수정</button></div><div class="form-options">${Object.entries(p.options||{}).map(([c,ss])=>`<div><b>${esc(c)}</b> : ${ss.map(esc).join(', ')}</div>`).join('')}</div><span class="chip ${p.published?'green':''}">${p.published?'공개 중':'숨김'}</span></div>`).join('')||'<div class="empty">상품을 등록해 주세요.</div>'}`}
function renderAdminQuotes(){let qq=state.quotes.filter(q=>state.filter==='all'||q.status===state.filter);return `<div class="row between"><h2>견적 및 확정 주문</h2><button class="btn sm secondary" data-action="refresh">새로고침</button></div><div class="controls" style="margin-bottom:10px">${['all','requested','quoted','confirmed','cancelled'].map(s=>`<button class="tab ${state.filter===s?'active':''}" data-filter="${s}">${s==='all'?'전체':statusLabel[s]}</button>`).join('')}</div>${qq.map(q=>`<div class="card ordercard"><div class="row between"><div><h3>${esc(q.buyer_name)}</h3><div class="quote-date">${fmtDate(q.created_at)} · ${esc(q.contact||'연락처 없음')}</div></div><span class="stagebadge">${statusLabel[q.status]}</span></div><div class="tiny">메모: ${esc(q.note||'없음')}</div>${q.items.map(i=>`<div class="orderitem"><div class="row between"><div class="grow"><b>${esc(i.store_name)} · ${esc(i.product_name)}</b><div class="tiny">${esc(i.color)} / ${esc(i.size)} · ${i.quantity}개</div></div><span class="money">${i.unit_price==null?'가격 미정':money(i.unit_price*i.quantity)}</span></div><div class="row wrap" style="margin-top:8px"><form class="controlinline" data-price="${i.id}"><input type="number" min="0" max="100000000" placeholder="개당 가격" value="${i.unit_price??''}" name="price" aria-label="개당 가격" ${q.status==='confirmed'?'disabled':''}><button type="submit" class="btn sm secondary" ${q.status==='confirmed'?'disabled':''}>가격 저장</button></form>${q.status==='confirmed'?`<select class="statusselect" data-fulfillment="${i.id}" aria-label="미송 및 품절 상태">${Object.entries(fulfillmentLabel).map(([k,v])=>`<option value="${k}" ${i.fulfillment===k?'selected':''}>${v}</option>`).join('')}</select>`:''}</div></div>`).join('')}<div class="sumline"><strong>총 ${q.items.reduce((n,i)=>n+i.quantity,0)}개 / ${unknown(q)?'가격 미정 '+unknown(q)+'개':money(previewOrderSum(q))}</strong></div>${q.status==='requested'?`<button class="btn block" data-action="publish-quote" data-id="${q.id}" ${unknown(q)?'disabled':''}>${unknown(q)?'모든 가격 입력 후 안내 가능':'견적 안내 완료 처리'}</button>`:''}${q.status==='quoted'?'<div class="info">고객이 확인 후 ‘최종 주문’ 버튼을 눌러야 확정돼요.</div>':''}${q.status==='confirmed'?`<form data-payment="${q.id}" class="two"><div><label class="label">받은 금액<input name="paid" type="number" min="0" value="${q.amount_paid||0}"></label></div><div><label class="label">환불 완료<input name="refunded" type="number" min="0" value="${q.amount_refunded||0}"></label></div><button type="submit" class="btn secondary" style="grid-column:span 2">입금·환불 금액 저장</button></form><div class="tiny">남은 금액: ${money(Math.max(0,previewOrderSum(q)-(q.amount_paid||0)+(q.amount_refunded||0)))}</div>`:''}<div class="row wrap" style="margin-top:10px"><button class="btn sm neutral" data-action="copy-quote" data-id="${q.id}">견적 내용 복사</button><button class="btn sm neutral" data-action="copy-customer-link" data-id="${q.id}">고객 확인 링크 복사</button></div></div>`).join('')||'<div class="empty">해당 상태의 견적이 없어요.</div>'}`}
function vendorGroups(){const g=new Map();for(const q of state.quotes.filter(q=>q.status==='confirmed'))for(const i of q.items){if(i.fulfillment==='sold_out')continue;const key=JSON.stringify([i.store_name,i.product_name,i.color,i.size]);let x=g.get(key);if(!x){x={store:i.store_name,product:i.product_name,color:i.color,size:i.size,qty:0,people:new Set()};g.set(key,x)}x.qty+=i.quantity;x.people.add(q.buyer_name)}return [...g.values()].sort((a,b)=>a.store.localeCompare(b.store,'ko')||a.product.localeCompare(b.product,'ko'))}
function vendorText(){return vendorGroups().map(x=>`${x.store} / ${x.product} / ${x.color} / ${x.size} ×${x.qty}`).join('\n')||'확정된 발주 내역이 없어요'}
function renderVendorSummary(){const groups=vendorGroups(),stores=[...new Set(groups.map(g=>g.store))];return `<div class="sectiontitle"><div><h2>가게별 확정 발주</h2><div class="sub">최종 주문만 합산 · 품절 제외 · 미송 포함</div></div><button class="btn sm secondary" data-action="copy-vendors">전체 복사</button></div>${stores.map(name=>{const a=groups.filter(g=>g.store===name);return `<div class="card"><h3>🏬 ${esc(name)}</h3>${a.map(x=>`<div class="line"><div class="row between"><div><b>${esc(x.product)}</b><div class="tiny">${esc(x.color)} / ${esc(x.size)} · ${esc([...x.people].join(', '))}</div></div><strong>${x.qty}개</strong></div></div>`).join('')}<div class="sumline total"><span>이 가게 발주 수량</span><strong>${a.reduce((s,i)=>s+i.qty,0)}개</strong></div></div>`}).join('')||'<div class="empty">아직 확정된 주문이 없어요.</div>'}`}
function renderAdminSettings(){return `<div class="card"><h3>고객에게 보낼 주소</h3><p class="smallnote">상품 고르고 견적 요청을 보낼 수 있는 링크예요.</p><div class="info nooverflow">${esc(publicLink())}</div><button class="btn block" data-action="copy-shop-link">주문 링크 복사</button><div class="separator"></div><button class="btn block secondary" data-action="export-csv">주문 내역 CSV 저장</button>${connected?'<button class="btn block neutral" style="margin-top:9px" data-action="logout">관리자 로그아웃</button>':''}<p class="smallnote">가격·품절·미송·입금 상태는 관리자 전용입니다. 아직 견적만 요청한 상품은 확정 주문 수량에 포함되지 않아요.</p></div>`}
function modal(){const m=state.modal;if(!m)return '';const wrap=(title,body)=>`<div class="overlay" id="overlay"><div class="sheet" role="dialog" aria-modal="true"><div class="sheethead"><h2>${title}</h2><button class="close" data-action="close">×</button></div>${body}</div></div>`;
if(m.type==='pick'){const p=selectedProd(m.id),colors=Object.keys(p.options||{}),color=colors.includes(m.color)?m.color:colors[0],sizes=p.options[color]||[];return wrap('옵션 선택',`<div class="smallnote">${esc(storeName(p.store_id))}</div><h3>${esc(p.name)}</h3><form id="pick"><label class="label">컬러<select name="color" id="pickColor">${colors.map(c=>`<option ${c===color?'selected':''}>${esc(c)}</option>`).join('')}</select></label><label class="label">사이즈<select name="size" id="pickSize">${sizes.map(s=>`<option>${esc(s)}</option>`).join('')}</select></label><label class="label">수량<input type="number" name="qty" value="1" min="1" max="20" required></label><button class="btn block" type="submit">장바구니 담기</button></form>`)}
if(m.type==='cart'){return wrap('견적 요청 장바구니',`<div class="smallnote">여러 가게 상품을 한 번에 견적 요청할 수 있어요.</div>${state.cart.map((c,i)=>`<div class="cartline"><b>${esc(storeName(c.store_id))} · ${esc(c.product_name)}</b><div class="tiny">${esc(c.color)} / ${esc(c.size)} · ${c.quantity}개</div><button class="textbutton" data-action="cart-remove" data-i="${i}">삭제</button></div>`).join('')||'<div class="empty">장바구니에 담은 상품이 없어요.</div>'}${state.cart.length?`<form id="request"><label class="label">주문자 이름<input name="name" maxlength="40" required placeholder="예: 다울언니"></label><label class="label">연락처 (선택)<input name="contact" maxlength="80" placeholder="안내용 연락처"></label><label class="label">요청 메모 (선택)<textarea name="note" maxlength="300" placeholder="거래처에 확인할 내용"></textarea></label><div class="info">지금은 <b>가격만 문의하는 견적 요청</b>이에요. 아직 주문이 확정되지 않아요.</div><button class="btn block" type="submit">전체 ${cartCount()}개 견적 요청하기</button></form>`:''}`)}
if(m.type==='store'){const s=state.stores.find(x=>x.id===m.id);return wrap(s?'가게 수정':'가게 등록',`<form id="store-form"><label class="label">남대문 가게 이름<input name="name" maxlength="100" required value="${esc(s?.name||'')}" placeholder="예: 동대문상회"></label><label class="stageradio"><input type="checkbox" name="active" ${s?.active===false?'':'checked'}> 주문자 화면에 표시</label><button class="btn block" type="submit">가게 저장</button></form>`)}
if(m.type==='product'){const pr=selectedProd(m.id);let lines=Object.entries(pr?.options||{}).map(([c,sz])=>c+': '+sz.join(', ')).join('\n');return wrap(pr?'상품 수정':'상품 등록',`<form id="product-form"><label class="label">거래처(가게)<select name="store" required>${state.stores.map(s=>`<option value="${s.id}" ${pr?.store_id===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label><label class="label">옷 이름<input name="name" maxlength="100" required value="${esc(pr?.name||'')}" placeholder="예: 하트호피 전신슈트"></label><label class="label">컬러별 사이즈 옵션</label><textarea name="options" required rows="6" placeholder="크림: BS, BM\n핑크: XS, S, M">${esc(lines)}</textarea><p class="help">한 줄에 컬러 하나씩 입력하고, 콜론(:) 뒤에 그 컬러에서 선택 가능한 사이즈를 쉼표로 구분해 주세요.</p><div class="form-options">예) 크림: BS, BM<br>블루: XS, S, M<br>레드: L</div><label class="stageradio" style="margin:15px 0"><input type="checkbox" name="published" ${pr?.published===false?'':'checked'}> 주문자 화면에 공개</label><button class="btn block" type="submit">상품 저장</button></form>`)}
if(m.type==='myquotes'){return wrap('내 견적 요청 내역',`<div class="smallnote">이 기기에서 요청한 내역이에요. 다른 기기에서는 견적 링크가 필요해요.</div>${state.receipts.map(q=>`<div class="storeitem"><div><b>${esc(q.name)}</b><div class="tiny">${fmtDate(q.date)} · ${q.id.slice(0,8)}</div></div><button class="btn sm secondary" data-action="open-saved" data-id="${q.id}">확인하기</button></div>`).join('')||'<div class="empty">저장된 견적 요청이 없어요.</div>'}`)}return ''}
function renderModal(){return modal()}
function modalOpen(type,id=null){state.modal={type,id};render()}
function parseOptions(t){const result={};for(let line of t.split(/\n/)){if(!line.trim())continue;const j=line.indexOf(':');if(j<1)throw Error('옵션을 "크림: BS, BM" 형태로 입력해 주세요');const color=line.slice(0,j).trim(),ss=[...new Set(line.slice(j+1).split(/[,，]/).map(x=>x.trim()).filter(Boolean))];if(!ss.length)throw Error(color+' 컬러에 사이즈가 없어요');if(result[color])throw Error(color+' 컬러가 두 번 입력됐어요');if(color.length>50||ss.some(s=>s.length>30))throw Error('옵션 이름이 너무 길어요');result[color]=ss}if(!Object.keys(result).length||Object.keys(result).length>30)throw Error('컬러 1~30개를 등록해 주세요');return result}
async function putStore(s,id){if(!connected){if(id)Object.assign(demo.stores.find(x=>x.id===id),s);else demo.stores.push({...s,id:uuid()});saveDemo();return}const path='/rest/v1/gq_stores'+(id?'?id=eq.'+id:'');await api(path,{method:id?'PATCH':'POST',body:s,admin:true})}
async function putProduct(o,id){if(!connected){if(id)Object.assign(demo.products.find(x=>x.id===id),o);else demo.products.push({...o,id:uuid()});saveDemo();return}const path='/rest/v1/gq_products'+(id?'?id=eq.'+id:'');await api(path,{method:id?'PATCH':'POST',body:o,admin:true})}
async function requestQuote(name,contact,note){const items=state.cart.map(c=>({product_id:c.product_id,color:c.color,size:c.size,quantity:c.quantity}));if(!items.length)throw Error('상품을 먼저 담아 주세요');if(!connected){const id=uuid(),token=uuid(),q={id,lookup_token:token,buyer_name:name,contact,note,status:'requested',amount_paid:0,amount_refunded:0,created_at:now()};demo.quotes.unshift(q);for(const c of state.cart)demo.items.push({id:uuid(),quote_id:id,store_name:storeName(c.store_id),product_name:c.product_name,color:c.color,size:c.size,quantity:c.quantity,unit_price:null,fulfillment:'ordered',created_at:now()});saveDemo();return{id,token}}
return rpc('gq_request_quote',{p_name:name,p_contact:contact,p_note:note,p_items:items})}
async function openTracking(id,token){state.trackId=id;state.trackToken=token;state.page='track';state.modal=null;history.pushState({},'',location.pathname+'?page=track&id='+encodeURIComponent(id)+'&token='+encodeURIComponent(token));state.tracking=null;render();try{await reloadTracking()}catch(e){notif(errorText(e));render()}}
async function reloadTracking(){if(!state.trackId||!state.trackToken)return;let q;if(!connected){q=demo.quotes.find(x=>x.id===state.trackId&&x.lookup_token===state.trackToken);q=q?{...clone(q),items:clone(demo.items.filter(i=>i.quote_id===q.id)).map(i=>({...i,unit_price:q.status==='requested'?null:i.unit_price,fulfillment:q.status==='confirmed'?i.fulfillment:'ordered'}))}:null}else q=await rpc('gq_read_quote',{p_quote_id:state.trackId,p_lookup_token:state.trackToken});if(!q)throw Error('견적을 찾을 수 없어요');state.tracking=q;render()}
async function confirmFinalQuote(){if(!state.tracking||state.tracking.status!=='quoted')throw Error('최종 주문할 수 없는 상태예요');if(!connected){const q=demo.quotes.find(x=>x.id===state.trackId&&x.lookup_token===state.trackToken);if(!q||demo.items.some(i=>i.quote_id===q.id&&i.unit_price==null))throw Error('견적 준비 중이에요');q.status='confirmed';saveDemo()}else await rpc('gq_confirm_quote',{p_quote_id:state.trackId,p_lookup_token:state.trackToken});await reloadTracking()}
async function adminItemPrice(id,price){if(!connected){const i=demo.items.find(x=>x.id===id);i.unit_price=price;saveDemo();return}await api('/rest/v1/gq_quote_items?id=eq.'+id,{method:'PATCH',admin:true,body:{unit_price:price}})}
async function adminPublish(id){const q=state.quotes.find(q=>q.id===id);if(!q||unknown(q))throw Error('먼저 모든 품목의 가격을 입력해 주세요');if(!connected){demo.quotes.find(q=>q.id===id).status='quoted';saveDemo();return}await api('/rest/v1/gq_quotes?id=eq.'+id,{method:'PATCH',admin:true,body:{status:'quoted',quoted_at:now()}})}
async function adminFulfillment(id,s){if(!connected){demo.items.find(x=>x.id===id).fulfillment=s;saveDemo();return}await api('/rest/v1/gq_quote_items?id=eq.'+id,{method:'PATCH',admin:true,body:{fulfillment:s}})}
async function adminPayment(id,paid,refunded){if(refunded>paid)throw Error('환불 완료액은 받은 금액보다 클 수 없어요');if(!connected){Object.assign(demo.quotes.find(x=>x.id===id),{amount_paid:paid,amount_refunded:refunded});saveDemo();return}await api('/rest/v1/gq_quotes?id=eq.'+id,{method:'PATCH',admin:true,body:{amount_paid:paid,amount_refunded:refunded}})}
const copy=async text=>{try{await navigator.clipboard.writeText(text)}catch{const a=document.createElement('textarea');a.value=text;document.body.append(a);a.select();document.execCommand('copy');a.remove()}notif('복사했어요')};
const csv=()=>{const rows=[['견적번호','주문자','가게','상품명','컬러','사이즈','수량','단가','상태','미송/품절','받은금액','환불완료','요청일']];for(const q of state.quotes)for(const i of q.items)rows.push([q.id,q.buyer_name,i.store_name,i.product_name,i.color,i.size,i.quantity,i.unit_price??'',statusLabel[q.status],fulfillmentLabel[i.fulfillment],q.amount_paid,q.amount_refunded,q.created_at]);const text='\ufeff'+rows.map(a=>a.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const blob=new Blob([text],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='공구노트_견적및주문_'+new Date().toISOString().slice(0,10)+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
const findTrack=id=>state.receipts.find(x=>x.id===id);
function quoteText(q){return `${q.buyer_name}님 · ${statusLabel[q.status]}\n`+q.items.map(i=>`${i.store_name} / ${i.product_name} / ${i.color} / ${i.size} ×${i.quantity} / ${i.unit_price==null?'미정':money(i.unit_price*i.quantity)}`).join('\n')+`\n합계: ${unknown(q)?'계산 중':money(previewOrderSum(q))}`}
async function click(e){const pg=e.target.closest('[data-page]');if(pg){goto(pg.dataset.page);return}const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;try{
if(a==='close'){state.modal=null;render()}else if(a==='pick-product'){modalOpen('pick',id)}else if(a==='open-cart'){modalOpen('cart')}else if(a==='cart-remove'){state.cart.splice(Number(b.dataset.i),1);saveCart();modalOpen('cart')}else if(a==='add-store'||a==='edit-store'){modalOpen('store',a==='edit-store'?id:null)}else if(a==='add-product'||a==='edit-product'){modalOpen('product',a==='edit-product'?id:null)}else if(a==='my-quotes'){modalOpen('myquotes')}else if(a==='open-saved'){const r=findTrack(id);if(r)await openTracking(r.id,r.token)}else if(a==='refresh'){await loadAdmin();notif('새로고침 완료')}else if(a==='copy-shop-link'){await copy(publicLink())}else if(a==='copy-track'){await copy(trackLink(state.trackId,state.trackToken))}else if(a==='load-track'){await reloadTracking();notif('최신 상태를 불러왔어요')}else if(a==='copy-quote'){await copy(quoteText(state.quotes.find(q=>q.id===id)))}else if(a==='copy-customer-link'){const q=state.quotes.find(q=>q.id===id);await copy(trackLink(q.id,q.lookup_token))}else if(a==='publish-quote'){if(!window.confirm('가격 확인을 마쳤나요? 고객에게 견적을 보여줍니다.'))return;await adminPublish(id);await loadAdmin();notif('견적을 공개했어요')}else if(a==='confirm-quote'){if(!window.confirm('이 견적으로 최종 주문을 확정할까요?'))return;await confirmFinalQuote();notif('최종 주문이 확정됐어요!')}else if(a==='export-csv'){csv()}else if(a==='copy-vendors'){await copy(vendorText())}else if(a==='logout'){session=null;localStorage.removeItem(SESS);state.admin=false;render()} }catch(ex){notif(errorText(ex))}}
async function submit(e){const f=e.target;if(!['pick','request','store-form','product-form','login'].includes(f.id)&&!f.dataset.price&&!f.dataset.payment)return;e.preventDefault();if(busy)return;busy=true;const data=new FormData(f);try{if(f.id==='pick'){const pr=selectedProd(state.modal.id),color=data.get('color'),size=data.get('size'),quantity=Number(data.get('qty'));if(!pr?.options[color]?.includes(size)||quantity<1||quantity>20)throw Error('옵션을 다시 확인해 주세요');const same=state.cart.find(x=>x.product_id===pr.id&&x.color===color&&x.size===size);if(same)same.quantity+=quantity;else state.cart.push({product_id:pr.id,store_id:pr.store_id,product_name:pr.name,color,size,quantity});saveCart();state.modal=null;render();notif('장바구니에 담았어요')}
else if(f.id==='request'){const name=String(data.get('name')||'').trim(),contact=String(data.get('contact')||'').trim(),note=String(data.get('note')||'').trim();if(!name)throw Error('이름을 입력해 주세요');const r=await requestQuote(name,contact,note);state.receipts.unshift({id:r.id,token:r.token,name,date:now()});saveTracks();state.cart=[];saveCart();await openTracking(r.id,r.token);notif('견적 요청이 접수됐어요. 이 링크를 보관해 주세요')}
else if(f.id==='store-form'){const name=String(data.get('name')).trim();await putStore({name,active:data.has('active')},state.modal.id);state.modal=null;await loadAdmin();notif('가게를 저장했어요')}
else if(f.id==='product-form'){const o={store_id:String(data.get('store')),name:String(data.get('name')).trim(),options:parseOptions(String(data.get('options'))),published:data.has('published')};await putProduct(o,state.modal.id);state.modal=null;await loadAdmin();notif('상품을 저장했어요')}
else if(f.id==='login'){if(!connected)throw Error('온라인 연결 설정을 먼저 해 주세요');const r=await fetch(url+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:key,'Content-Type':'application/json'},body:JSON.stringify({email:data.get('email'),password:data.get('password')})});const j=await r.json();if(!r.ok)throw Error(j.error_description||'로그인 실패');session={...j,expires_at:Math.floor(Date.now()/1000)+j.expires_in};localStorage.setItem(SESS,JSON.stringify(session));await loadAdmin();notif('관리자 로그인 완료')}
else if(f.dataset.price){const id=f.dataset.price,value=data.get('price');if(value===''||!Number.isInteger(Number(value))||Number(value)<0)throw Error('개당 가격을 입력해 주세요');await adminItemPrice(id,Number(value));await loadAdmin();notif('가격 저장 완료')}
else if(f.dataset.payment){const paid=Number(data.get('paid')),refunded=Number(data.get('refunded'));if(!Number.isInteger(paid)||!Number.isInteger(refunded)||paid<0||refunded<0)throw Error('금액을 확인해 주세요');await adminPayment(f.dataset.payment,paid,refunded);await loadAdmin();notif('입금 기록 완료')}
}catch(ex){notif(errorText(ex))}finally{busy=false}}
async function change(e){const x=e.target;if(x.id==='pickColor'){state.modal.color=x.value;const p=selectedProd(state.modal.id);$('#pickSize').innerHTML=(p.options[x.value]||[]).map(s=>`<option>${esc(s)}</option>`).join('')}else if(x.dataset.tab){state.tab=x.dataset.tab;render()}else if(x.dataset.filter){state.filter=x.dataset.filter;render()}else if(x.dataset.fulfillment){if(busy)return;busy=true;try{await adminFulfillment(x.dataset.fulfillment,x.value);await loadAdmin();notif('상태가 변경됐어요')}catch(ex){notif(errorText(ex))}finally{busy=false}}}
function input(e){if(e.target.id==='search'){state.search=e.target.value;const pos=e.target.selectionStart;render();const el=$('#search');if(el){el.focus();el.setSelectionRange(pos,pos)}}}
app.addEventListener('click',e=>{const tab=e.target.closest('[data-tab]'),filter=e.target.closest('[data-filter]');if(tab){state.tab=tab.dataset.tab;render();return}if(filter){state.filter=filter.dataset.filter;render();return}click(e)});
app.addEventListener('submit',submit);app.addEventListener('change',change);app.addEventListener('input',input);
window.addEventListener('popstate',()=>{const pp=new URLSearchParams(location.search);state.page=pp.get('page')||'shop';state.trackId=pp.get('id')||'';state.trackToken=pp.get('token')||'';state.modal=null;render();if(state.page==='track')reloadTracking().catch(e=>notif(errorText(e)));if(state.page==='admin')loadAdmin().catch(e=>notif(errorText(e)))});
(async()=>{try{if(state.page==='admin')await loadAdmin();else if(state.page==='track'){await loadCatalog();await reloadTracking()}else await loadPublic()}catch(e){render();notif(errorText(e))}})();
})();

</script>
</body>
</html>
